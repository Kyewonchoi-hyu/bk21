/* ── 19대 국가전략기술 체계에 근거한 판정 ─────────────────────────
   기존 parseTopic() 이 한 문장에서 '수단'과 '연구 대상'을 갈라내고,
   classifyTech() 가 대상을 19대 분야·중분류로 찍는다. 그 결과로 판정한다.

     원천 기술 — 연구 대상이 선택 기술 f 이고, 그 중분류가 f 의 원천 중분류
     연계 기술 — f 를 수단으로 쓰고 연구 대상이 따로 있거나,
                 대상이 f 의 적용 중분류인 경우
     미판정   — 대상·수단 어느 쪽으로도 f 와의 관계를 확인하지 못한 경우
                (타 분야 대상, 체계 밖 대상, 표현 부족을 사유로 나눠 적는다)

   미판정을 부적합·무관·체계 밖으로 확정하지 않는다. */
/* ══ 19대 정합성 분석 : 사실 추출 → 규칙 엔진 ══════════════════════
   설계 원칙
     1단계  extractTechFacts()   원문에서 사실 요소만 뽑는다. 판정하지 않는다.
     2단계  technology_role      그 기술이 이 연구에서 하는 역할을 정한다.
     3단계  classifyTechFacts()  명시적 규칙만으로 최종 분류를 결정한다.
   원천 판정으로 가는 경로는 규칙 엔진 한 곳뿐이다.
   중분류가 원천 범주라는 사실은 어디에서도 판정 근거로 쓰지 않는다.        */

var ROLE = {
  DEV: "TECHNOLOGY_DEVELOPMENT", APP: "TECHNOLOGY_APPLICATION",
  OBJ: "RESEARCH_OBJECT", POL: "POLICY_SOCIAL_CONTEXT",
  INC: "INCIDENTAL_MENTION", UNK: "UNCLEAR"
};
var ROLE_KO = {
  TECHNOLOGY_DEVELOPMENT: "기술개발", TECHNOLOGY_APPLICATION: "기술활용",
  RESEARCH_OBJECT: "연구대상", POLICY_SOCIAL_CONTEXT: "정책·사회 맥락",
  INCIDENTAL_MENTION: "단순 언급", UNCLEAR: "판단 불가"
};
var CLASS_KO = {
  SOURCE_TECH_CANDIDATE: "원천 기술 후보", LINKED_TECH_CANDIDATE: "연계 기술 후보",
  TECH_RESEARCH_OBJECT: "기술이 연구대상", POLICY_SOCIAL_CONTEXT: "정책·사회 맥락",
  UNDETERMINED: "미판정"
};

/* 사실 추출에 쓰는 표현 목록. 판정 기준이 아니라 '무엇에 관한 말인가'를 가른다. */
var TECH_NOUN = /(기술|알고리즘|모델|소재|부품|공정|구조|기법|장치|소자|하드웨어|회로|촉매|전극|센서|아키텍처|가속기|추론|학습|인프라|반도체|배터리|셀|장비|플랫폼|소프트웨어)/u;
var SOCIAL_NOUN = /(사회|지역|정책|제도|규제|거버넌스|윤리|공공|인구|지방|조직|행정|재정|교육과정|일자리|돌봄|복지|위기|민주|여론|수용성|불평등|격차)/u;
var POLICY_NOUN = /(정책|제도|규제|거버넌스|수용성|여론|산업구조|일자리|지방소멸|복지|행정|재정|민주|공공)/u;
var PHENOM = /(억제|검열|편향|왜곡|영향|파급|인식|수용|확산|현상|양상|담론|태도|책임|위험)/u;
var DEV_VERB = /(개발|설계|구축|구현|제안|고안|창출|합성|제작|확보|혁신|고도화)/u;
var MEANS_MARK = /(기반|활용|이용|통해|통한|적용|응용|접목|결합|도입|써서|로써)/u;
var NOT_MEANS = /^(?:로|으로)\s*(인한|인해|말미암)/u;
var NEW_MARK = /(새로운|신규|차세대|신개념|혁신적인)/u;
var IMPROVE = /(성능|정확도|효율|속도|정밀도|수율|저항|손실|내구성|수명|안정성|출력|용량|밀도|처리량|지연|해상도|민감도|선택도|신뢰성|결맞음)[^.?]{0,18}(개선|향상|저감|낮추|높이|극대화|극복|최적화|끌어올)/u;
var LIMIT = /(한계|병목|난제|문제점|제약)[^.?]{0,18}(극복|해결|돌파|개선)/u;
var NO_DEV = /(개발하지\s*않|직접\s*개발은\s*아니|기술\s*개발이\s*아니)/u;

/* ── 1단계 : 사실 추출 ── */
function extractTechFacts(text, field) {
  var raw = String(text == null ? "" : text).trim();
  var pat = BK21AnalysisV2.fieldPattern(field);
  var f = {
    research_object: "", research_purpose: "", research_method: "", expected_output: "",
    selected_strategic_field: field, related_strategic_technology: "", related_official_subcategory: "",
    selected_field_alignment: "UNCLEAR", technology_role: ROLE.UNK,
    new_technology_evidence: "UNCLEAR", technology_improvement_evidence: "UNCLEAR",
    evidence_quote: "", confidence: "LOW"
  };
  if (!raw) { f.technology_role = ROLE.UNK; f.confidence = "HIGH"; return f; }

  var pt = parseTopic(raw);
  f.research_object = pt.objectText || raw;
  f.related_strategic_technology = pt.object || "";
  if (pt.objId) f.related_official_subcategory = pt.objId + " " + pt.objGroup;

  /* 기술어가 문장 어디에 나오는가 */
  var spots = [], m;
  if (pat) { var g = new RegExp(pat.source, "giu");
    while ((m = g.exec(raw)) !== null) { spots.push([m.index, m.index + m[0].length]); if (m.index === g.lastIndex) g.lastIndex++; } }
  var termHit = spots.length > 0;

  /* 수단으로 쓰였는가 */
  var meansHits = [];
  spots.forEach(function (sp) {
    var after = raw.slice(sp[1], sp[1] + 12);
    if (MEANS_MARK.test(after) && !NOT_MEANS.test(after)) meansHits.push(raw.slice(Math.max(0, sp[0] - 8), sp[1] + 10).trim());
  });
  if ((pt.means || []).indexOf(field) >= 0 && !meansHits.length) meansHits.push(field);
  if (meansHits.length) f.research_method = meansHits[0];

  /* 무엇을 개발하는가 — 수단 표현을 걷어낸 목적어만 본다 */
  var devTargets = [], dv = new RegExp(DEV_VERB.source, "gu"), dm;
  while ((dm = dv.exec(raw)) !== null) {
    var head = raw.slice(Math.max(0, dm.index - 40), dm.index)
      .replace(/^.*?(?:기반|활용한|활용해|이용한|이용해|통한|통해|적용한|접목한|써서)\s*/u, "")
      .replace(/[^가-힣A-Za-z0-9·\-\s]/gu, " ").trim();
    if (head) devTargets.push(head + " " + dm[0]);
    if (dm.index === dv.lastIndex) dv.lastIndex++;
  }
  /* 개발 목적어에 사회·제도 명사가 섞이면 기술 개발로 보지 않는다 */
  var devOnTech = devTargets.filter(function (t) {
    if (SOCIAL_NOUN.test(t)) return false;
    return (pat && pat.test(t)) || TECH_NOUN.test(t);
  });
  /* 동사가 없어도 '새로운 + 기술 명사'는 개발 산출물로 본다 */
  var newPhrase = "";
  var nv = new RegExp(NEW_MARK.source, "gu"), nm;
  while ((nm = nv.exec(raw)) !== null) {
    var tail = raw.slice(nm.index, nm.index + 26);
    if (TECH_NOUN.test(tail) && !SOCIAL_NOUN.test(tail)) { newPhrase = tail.split(/[?.]/)[0].trim(); break; }
    if (nm.index === nv.lastIndex) nv.lastIndex++;
  }
  if (devOnTech.length) f.expected_output = devOnTech[0];
  else if (newPhrase) f.expected_output = newPhrase;
  else if (devTargets.length) f.expected_output = devTargets[0];

  /* 기술 개선 근거 — 기술 맥락에서만 인정 */
  function techContext(re) {
    var g2 = new RegExp(re.source, "gu"), mm;
    while ((mm = g2.exec(raw)) !== null) {
      var pre = raw.slice(Math.max(0, mm.index - 22), mm.index), post = raw.slice(mm.index, mm.index + 30);
      if (SOCIAL_NOUN.test(pre.slice(-14)) || SOCIAL_NOUN.test(post.slice(0, 14))) { if (mm.index === g2.lastIndex) g2.lastIndex++; continue; }
      if ((pat && (pat.test(pre) || pat.test(post))) || TECH_NOUN.test(post) || TECH_NOUN.test(pre.slice(-14)))
        return (pre.slice(-10) + post.split(/[?.]/)[0]).trim();
      if (mm.index === g2.lastIndex) g2.lastIndex++;
    }
    return "";
  }
  var improveQuote = techContext(IMPROVE) || techContext(LIMIT);
  f.new_technology_evidence = NO_DEV.test(raw) ? "NO" : (devOnTech.length && (newPhrase || NEW_MARK.test(raw))) || newPhrase ? "YES" : devOnTech.length ? "UNCLEAR" : "NO";
  f.technology_improvement_evidence = NO_DEV.test(raw) ? "NO" : improveQuote ? "YES" : devOnTech.length ? "UNCLEAR" : "NO";
  f.evidence_quote = newPhrase || improveQuote || (devOnTech[0] || "") || (meansHits[0] || "");

  /* ── 2단계 : 역할 판정 ── */
  var socialTopic = SOCIAL_NOUN.test(raw);
  if (!termHit && pt.object !== field) f.technology_role = ROLE.UNK;
  else if (devOnTech.length || (newPhrase && termHit)) f.technology_role = ROLE.DEV;
  else if (meansHits.length) f.technology_role = ROLE.APP;
  else if (termHit && POLICY_NOUN.test(raw)) f.technology_role = ROLE.POL;
  else if (termHit && PHENOM.test(raw)) f.technology_role = ROLE.OBJ;
  else if (termHit && socialTopic) f.technology_role = ROLE.POL;
  else if (pt.object === field) f.technology_role = ROLE.OBJ;
  else if (termHit) f.technology_role = ROLE.INC;
  else f.technology_role = ROLE.UNK;

  if (f.technology_role === ROLE.POL) f.research_purpose = "정책·사회 현상 규명";
  else if (f.technology_role === ROLE.OBJ) f.research_purpose = "기술의 영향·특성 규명";
  else if (f.technology_role === ROLE.APP) f.research_purpose = "다른 분야 문제 해결";
  else if (f.technology_role === ROLE.DEV) f.research_purpose = "기술 자체의 개발·개선";

  /* 정합성은 원천·연계와 별개의 축이다 */
  f.selected_field_alignment = (pt.object === field && pt.objId) ? "ALIGNED"
    : (termHit || meansHits.length) ? "PARTIALLY_ALIGNED"
    : (pt.object && pt.object !== "체계 밖" && pt.object !== field) ? "NOT_ALIGNED" : "UNCLEAR";

  f.confidence = (f.technology_role === ROLE.UNK) ? "LOW"
    : (f.technology_role === ROLE.DEV && f.new_technology_evidence === "UNCLEAR" && f.technology_improvement_evidence === "UNCLEAR") ? "LOW"
    : (f.technology_role === ROLE.INC) ? "LOW"
    : (devOnTech.length || meansHits.length || PHENOM.test(raw)) ? "HIGH" : "MEDIUM";
  return f;
}

/* ── 3단계 : 규칙 엔진. 원천으로 가는 유일한 경로다. ── */
function classifyTechFacts(f, field) {
  var role = f.technology_role, cls, cats, why;
  var gate = (f.new_technology_evidence === "YES" || f.technology_improvement_evidence === "YES");

  if (role === ROLE.DEV && gate) {                       /* RULE A */
    cls = "SOURCE_TECH_CANDIDATE"; cats = ["core"];
    why = "연구 산출물이 " + field + " 자체의 신규 개발 또는 실질적 개선입니다.";
  } else if (role === ROLE.DEV) {                        /* Hard Gate 미통과 */
    cls = "UNDETERMINED"; cats = ["pending"];
    why = "개발 대상은 " + field + " 자체로 보이지만, 신규 개발·실질적 개선의 원문 근거가 없어 원천으로 판정하지 않습니다.";
  } else if (role === ROLE.APP) {                        /* RULE B */
    cls = "LINKED_TECH_CANDIDATE"; cats = ["connected"];
    why = field + "를 다른 연구 대상의 방법·도구로 사용합니다.";
  } else if (role === ROLE.OBJ) {                        /* RULE C */
    cls = "TECH_RESEARCH_OBJECT"; cats = ["pending"];
    why = field + " 자체가 연구 대상입니다. 기술의 영향·특성을 규명하는 연구이므로 원천으로 판정하지 않습니다.";
  } else if (role === ROLE.POL) {                        /* RULE D */
    cls = "POLICY_SOCIAL_CONTEXT"; cats = ["pending"];
    why = field + "가 정책·사회 맥락으로 등장합니다. 기술 개발 연구가 아니므로 원천으로 판정하지 않습니다.";
  } else if (role === ROLE.INC) {                        /* RULE E */
    cls = "UNDETERMINED"; cats = ["pending"];
    why = field + " 표현이 등장하지만 연구의 핵심 대상·방법·산출물이 아닙니다.";
  } else {                                               /* RULE F */
    cls = "UNDETERMINED"; cats = ["pending"];
    why = "원문만으로 " + field + "와의 관계를 판단할 수 없습니다. 부적합·체계 밖으로 확정하지 않습니다.";
  }
  return { classification: cls, categories: cats, why: why };
}

/* 모듈이 부르는 진입점 */
function techJudge19(text, field) {
  var f = extractTechFacts(text, field);
  var r = classifyTechFacts(f, field);
  var reason = r.why +
    " [역할 " + ROLE_KO[f.technology_role] +
    " · 신규개발 근거 " + f.new_technology_evidence +
    " · 기술개선 근거 " + f.technology_improvement_evidence +
    " · 정합성 " + f.selected_field_alignment +
    " · 확신도 " + f.confidence + "]" +
    (f.evidence_quote ? " 근거 표현: " + f.evidence_quote : "") +
    (f.related_official_subcategory ? " 관련 중분류: " + f.related_official_subcategory +
      " (중분류가 원천 범주라는 것과 이 연구가 원천이라는 것은 별개입니다)." : "");
  var tax = (f.related_strategic_technology === field && f.related_official_subcategory)
    ? { id: f.related_official_subcategory.split(" ")[0], name: f.related_official_subcategory.split(" ").slice(1).join(" "), kind: "", hits: [] } : null;
  return {
    categories: r.categories, reason: reason, evidence: f.evidence_quote ? [f.evidence_quote] : [],
    tax: tax, role: ROLE_KO[f.technology_role], novelty: f.new_technology_evidence === "YES" ? "있음" : f.technology_improvement_evidence === "YES" ? "있음" : f.new_technology_evidence === "NO" ? "없음" : "확인불가",
    confidence: f.confidence, classification: r.classification, classificationLabel: CLASS_KO[r.classification],
    alignment: f.selected_field_alignment, facts: f, aiUse: f.technology_role === ROLE.APP
  };
}

  function onKey(e) { if (e.key === "Escape") close(); }
  $("#mx").onclick = close;
  $("#scrim").onclick = function (e) { if (e.target.id === "scrim") close(); };
  document.addEventListener("keydown", onKey);
  $("#mx").focus();
}

/* 임의의 표를 CSV 로 내보내기 */
function downloadCSV(name, head, lines) {
  var all = [head].concat(lines);
  var csv = "\ufeff" + all.map(function (row) {
    return row.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\r\n");
  try {
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name + "_" + todayISO() + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    toast("CSV 파일을 내려받았습니다.");
  } catch (e) {
    openModal("CSV 데이터 복사", '<p style="font-size:0.8438rem;color:var(--ink-2);margin-bottom:10px">' +
      "이 환경에서는 파일 저장이 막혀 있습니다. 아래 내용을 복사해 스프레드시트에 붙여 넣으세요.</p>" +
      '<textarea class="input" rows="12" readonly>' + esc(csv) + "</textarea>");
  }
}

function exportTechList(tech) {
  var lines = A.alignRows.filter(function (r) { return r.techs.indexOf(tech) >= 0; }).map(function (r) {
    var j = r.judged.filter(function (x) { return x.tech === tech; })[0];
    var jj = r.judged.filter(function (x) { return x.tech === tech; })[0];
    return [tech, j ? j.v : "체계 밖", (jj && jj.gid) || "", r.name, r.college, r.dept, rankOf(r.id),
      r.techs.join(" / "), r.objThemes.join(" / "), r.meanThemes.join(" / "),
      r.topics.map(function (t) { return t.text; }).join(" ||| ")];
  });
  downloadCSV("BK21_" + tech.replace(/[\/·]/g, "_") + "_명단",
    ["전략기술", "판정", "해당 중분류", "성명", "단과대학·대학원", "학과", "직급", "선택 분야 전체", "주제 대상", "주제 수단", "연구주제"], lines);
}

function exportIssueList(issue) {
  var lines = A.issueRows.filter(function (r) { return r.issue === issue; }).map(function (r) {
    return [issue, r.type, r.name, r.college, r.dept, r.techs, r.text];
  });
  downloadCSV("BK21_" + issue.replace(/[\/·]/g, "_") + "_명단",

}

function exportUnit(tech) {
  var c = clusters(A).filter(function (x) { return x.tech === tech; })[0];
  if (!c) return;
  var lines = c.members.map(function (m) {
    var ar = A.alignRows.filter(function (x) { return x.id === m.id; })[0];
    var j = ar ? (ar.judged.filter(function (x) { return x.tech === tech; })[0] || {}).v : "";
    return [tech, j || "-", m.name, m.college || DEPT_COLLEGE[m.dept] || "", m.dept, m.rank,
      (m.techs || []).join(" / "), m.problem || "", (m.topics || []).join(" ||| ")];
  });
  downloadCSV("BK21_" + tech.replace(/[\/·]/g, "_") + "_교육연구단_구성안",
    ["교육연구단(가칭)", "역할", "성명", "단과대학·대학원", "학과", "직급", "선택 전략기술", "산업·사회 문제", "연구주제"], lines);
}

document.addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest("[data-go]") : null;
  if (b) go(b.dataset.go === "admin" ? "admin" : "cover");
});
window.addEventListener("hashchange", function () {
  var r = location.hash.replace("#/", "") || "cover";
  if (r !== route) { route = r; render(); }
});
route = (location.hash.replace("#/", "") || "cover");
if (["cover", "survey", "admin", "done"].indexOf(route) < 0) route = "cover";
if (route === "survey" || route === "done") route = "cover";

/* 교원용 주소에는 관리자 메뉴가 나타나지 않는다.
   담당자는 주소 끝에 ?view=admin 을 붙여 들어오고, 코드로 한 번 더 확인한다.
   교내 계정으로 로그인된 상태라면 코드 없이 계정만으로 통과한다. */
if (hasGAS && google.script.url && google.script.url.getLocation) {
  app.innerHTML = '<div class="wrap"><div class="empty-state">화면을 준비하는 중…</div></div>';
  google.script.url.getLocation(function (loc) {
    var v = (loc && loc.parameter && loc.parameter.view) || "";
    if (v === "admin") { adminEntry = true; route = "admin"; }
    render();
  });
} else {
  if (REMOTE && /[?&]view=admin/.test(location.search)) { adminEntry = true; route = "admin"; }
  render();
}

})();
