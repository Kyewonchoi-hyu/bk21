<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5단계 BK21 교원 참여의향 조사</title>
<style>
:root{
  --navy:#0A2A4E; --navy-2:#14477E; --cobalt:#2F6FD0; --cobalt-soft:#E9F0FB;
  --ink:#101720; --ink-2:#57626F; --ink-3:#8C97A4;
  --line:#DCE2EA; --line-2:#EDF1F5;
  --paper:#F3F5F8; --card:#FFFFFF;
  --go:#1B6F55; --go-soft:#E4F2ED;
  --hold:#A9711A; --hold-soft:#FBF0DC;
  --off:#7C8794; --off-soft:#EEF0F3;
  --danger:#B23A38;
  --r-lg:12px; --r-md:9px; --r-sm:6px;
  --shadow:0 1px 2px rgba(16,23,32,.05), 0 8px 24px -16px rgba(16,23,32,.35);
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(14.8px, 0.28vw + 13.2px, 17px)}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--paper); color:var(--ink);
  font-size:1rem; line-height:1.62; -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 0;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--navy-2)}
h1,h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.02em;font-weight:700}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 공통 상단 룰: 조사 공문의 이중선 모티프 (딱 한 번만 사용) ── */
.masthead{background:var(--navy);color:#fff;border-bottom:3px solid var(--cobalt)}
.masthead-in{max-width:1440px;margin:0 auto;padding:clamp(12px,1.1vw,17px) clamp(16px,2.8vw,40px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wordmark{font-weight:800;letter-spacing:-.03em;font-size:0.9375rem}
.wordmark span{opacity:.62;font-weight:500;margin-left:8px;letter-spacing:0}
.masthead-nav{margin-left:auto;display:flex;gap:6px}
.masthead-nav button{color:#C9D6E6;font-size:0.8438rem;padding:6px 12px;border-radius:999px;font-weight:600}
.masthead-nav button:hover{color:#fff;background:rgba(255,255,255,.1)}
.masthead-nav button[aria-current="page"]{color:var(--navy);background:#fff}

/* ── 레이아웃 ── */
.wrap{max-width:1440px;margin:0 auto;padding:clamp(20px,2.4vw,36px) clamp(16px,2.8vw,40px) 90px}
.wrap-narrow{max-width:900px}
.wrap-tight{max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(17px,1.7vw,24px)}
.grid{display:grid;gap:16px}
@media(max-width:720px){.card{padding:clamp(15px,3.6vw,20px)}}

/* ── 설문: 표지 ── */
.hero{background:var(--navy);color:#fff;min-height:calc(100vh - 57px);display:flex;align-items:center}
.hero-in{width:100%;max-width:1440px;margin:0 auto;padding:clamp(44px,5.4vw,84px) clamp(18px,3vw,44px);
  display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,4.4vw,72px);align-items:center}
.cover-kicker{font-size:clamp(12.5px,0.9vw,14px);color:#9FBBDD;font-weight:600;margin-bottom:clamp(12px,1.4vw,20px)}
.hero h1{font-size:clamp(30px,4.4vw,62px);text-wrap:balance;letter-spacing:-.05em;line-height:1.1;font-weight:800}
.hero-rule{margin-top:clamp(24px,3vw,40px);width:min(100%,420px);border-top:1px solid rgba(255,255,255,.3);
  border-bottom:3px solid rgba(255,255,255,.3);height:4px}
.hero-card{background:#fff;color:var(--ink);border-radius:16px;padding:clamp(24px,3vw,48px);
  box-shadow:0 40px 80px -40px rgba(0,0,0,.55)}
.cover-lead{color:var(--ink);text-wrap:pretty;font-size:clamp(15.2px,0.5vw + 14px,18px);line-height:1.68;letter-spacing:-.01em}
.meta-rows{margin:30px 0 34px;border-top:1px solid var(--line-2)}
.meta-row{display:flex;gap:20px;padding:15px 2px;border-bottom:1px solid var(--line-2);font-size:0.9375rem}
.meta-row dt{width:64px;flex:none;color:var(--ink-3);font-weight:600}
.meta-row dd{margin:0;color:var(--ink);line-height:1.6}
@media(max-width:1080px){
  .hero{min-height:0}
  .hero-in{grid-template-columns:1fr}
  .hero-rule{margin-top:24px}
}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:var(--r-md);font-weight:700;font-size:0.9062rem;
  border:1px solid transparent;transition:background .12s ease,border-color .12s ease}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-quiet{color:var(--ink-2);padding:11px 12px;font-weight:600}
.btn-quiet:hover{color:var(--ink)}
.btn-lg{padding:14px 26px;font-size:1.0rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ── 진행 표시 ── */
.stepbar{position:sticky;top:0;z-index:20;background:rgba(243,245,248,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);margin:0 calc(-1 * clamp(16px,2.8vw,40px)) 20px;
  padding:12px clamp(16px,2.8vw,40px)}
.stepbar-in{margin:0 auto}
.stepbar-head{display:flex;justify-content:space-between;align-items:baseline;font-size:0.8125rem;color:var(--ink-2);margin-bottom:8px}
.stepbar-head b{color:var(--ink);font-size:0.9062rem;font-weight:700;letter-spacing:-.01em}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.track-fill{height:100%;background:var(--navy);transition:width .28s cubic-bezier(.2,.7,.3,1)}

/* ── 설문 2단 레이아웃 ── */
.survey-grid{display:grid;grid-template-columns:minmax(200px,clamp(200px,17vw,270px)) minmax(0,1fr);
  gap:clamp(28px,3.6vw,60px);align-items:start;max-width:1280px;margin:0 auto}
.survey-main{min-width:0}
.rail{position:sticky;top:28px}
.rail h2{font-size:0.9375rem;letter-spacing:-.025em;color:var(--ink);margin-bottom:4px}
.rail .rail-sub{font-size:0.8125rem;color:var(--ink-3);margin-bottom:20px}
.rail-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  padding:11px 13px;border-radius:9px;color:var(--ink-3);font-weight:600;font-size:0.9062rem;
  transition:color .12s,background .12s}
.rail-item .n{width:25px;height:25px;border-radius:50%;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:0.75rem;background:#fff;font-weight:700}
.rail-item.done{color:var(--ink-2)}
.rail-item.done .n{background:var(--go-soft);border-color:#BFDCD1;color:var(--go)}
.rail-item.done:hover{color:var(--ink);background:#fff}
.rail-item[aria-current="step"]{color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.rail-item[aria-current="step"] .n{background:var(--navy);border-color:var(--navy);color:#fff}
.rail-item:disabled{cursor:default}
.card-form{padding:clamp(20px,2.4vw,38px)}
@media(min-width:961px){.stepbar{display:none}}
@media(max-width:960px){
  .survey-grid{grid-template-columns:1fr;gap:0;max-width:840px}
  .rail{display:none}
}

/* ── 폼 ── */
.q{padding:clamp(20px,2.1vw,32px) 0;border-bottom:1px solid var(--line-2)}
.q:first-child{padding-top:4px}
.q:last-child{border-bottom:none;padding-bottom:6px}
.q-title{font-size:clamp(16.4px,0.5vw + 15px,19.5px);font-weight:700;letter-spacing:-.025em;display:flex;gap:9px;align-items:baseline}
.q-title .idx{flex:none;font-weight:800;font-size:0.75rem;color:var(--navy);
  background:var(--cobalt-soft);padding:3px 9px;border-radius:6px;position:relative;top:-1px}
.q-major{border-bottom:none}
.q-major + .q-major{border-top:1px solid var(--line)}
.q-help{color:var(--ink-2);font-size:clamp(13.4px,0.3vw + 12.8px,15.4px);margin-top:8px;text-wrap:pretty}
.q-body{margin-top:16px}
.field{display:block;margin-bottom:14px}
.field-label{display:block;font-size:0.8438rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input,select.input,textarea.input{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-md);
  background:#fff;font-size:0.9375rem;transition:border-color .12s}
.input:hover{border-color:#C3CCD8}
.input:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
textarea.input{resize:vertical;min-height:92px;line-height:1.65}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%2357626F' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:36px}
.row-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(10px,1.1vw,16px)}
.email-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.05fr);gap:9px;align-items:center}
@media(max-width:420px){.email-row{grid-template-columns:1fr;gap:7px}.email-row .at{display:none}}
.email-row .at{color:var(--ink-3);font-weight:700}
.hint{font-size:0.8125rem;color:var(--ink-3);margin-top:6px}
.err{font-size:0.8125rem;color:var(--danger);margin-top:6px;font-weight:600}
.warn{font-size:0.8rem;color:var(--hold);margin-top:5px}
.input.is-bad{border-color:var(--danger);background:#FFFAFA}

/* 선택 카드 (참여 의향) */
.choices{display:grid;gap:10px}
.choice{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;border:1px solid var(--line);
  border-radius:var(--r-md);background:#fff;text-align:left;width:100%;transition:border-color .12s,background .12s}
.choice:hover{border-color:#B9C4D2}
.choice[aria-pressed="true"]{border-color:var(--navy);background:#F7FAFE;box-shadow:inset 0 0 0 1px var(--navy)}
.choice .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid #B9C4D2;flex:none;margin-top:2px;position:relative}
.choice[aria-pressed="true"] .dot{border-color:var(--navy)}
.choice[aria-pressed="true"] .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--navy)}
.choice b{display:block;font-size:0.9688rem;letter-spacing:-.02em}
.choice small{display:block;color:var(--ink-2);font-size:0.8438rem;margin-top:3px;line-height:1.5}
.choice-inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.choice-inline{grid-template-columns:1fr}}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;
  font-size:0.875rem;font-weight:600;color:var(--ink-2);transition:all .12s}
.chip:hover{border-color:#B9C4D2;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip-sm{padding:5px 11px;font-size:0.8rem;font-weight:600}
.chip-count{margin-left:6px;opacity:.65;font-weight:500}
.picked{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.tag{display:inline-flex;align-items:center;gap:7px;background:var(--cobalt-soft);color:var(--navy);
  border-radius:999px;padding:5px 8px 5px 12px;font-size:0.825rem;font-weight:600}
.tag button{width:17px;height:17px;border-radius:50%;background:rgba(10,42,78,.14);color:var(--navy);
  font-size:0.75rem;line-height:1;display:grid;place-items:center}
.tag button:hover{background:rgba(10,42,78,.28)}

/* 연구주제 입력 */
.topic{display:flex;gap:11px;align-items:flex-start;margin-bottom:11px}
.topic-n{width:26px;height:26px;flex:none;border-radius:50%;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-size:0.7812rem;font-weight:700;margin-top:9px}
.topic-n.opt{background:var(--line);color:var(--ink-3)}
.example{background:#FAFBFD;border:1px solid var(--line-2);border-radius:var(--r-md);padding:13px 15px;margin-top:12px}
.example-quiet{background:#FFFCF4;border-color:#EFE4C9}
.example-quiet h5{color:#8A6A1E}
.example-list{margin:0;font-size:0.85rem;color:var(--ink-2);line-height:1.9;word-break:keep-all}
.example h5{margin:0 0 7px;font-size:0.8125rem;color:var(--ink-2);font-weight:700}
.example li{font-size:0.8438rem;color:var(--ink-2);padding:3px 0;padding-left:13px;position:relative}
.example li::before{content:"";position:absolute;left:2px;top:12px;width:4px;height:4px;border-radius:50%;background:var(--ink-3)}

/* 검토 */
.review dl{margin:0;border-top:1px solid var(--line-2)}
.review-row{display:flex;gap:16px;padding:12px 2px;border-bottom:1px solid var(--line-2);align-items:baseline}
.review-row dt{width:clamp(96px,14%,140px);flex:none;color:var(--ink-3);font-size:0.8438rem;font-weight:600}
.review-row dd{margin:0;flex:1;font-size:0.9062rem;white-space:pre-wrap;word-break:break-word}
.review-row dd .empty{color:var(--ink-3)}
@media(max-width:600px){.review-row{flex-direction:column;gap:3px}.review-row dt{width:auto}}

/* 완료 */
.done{text-align:center;padding:64px 28px}
.done-mark{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;background:var(--go-soft);
  display:grid;place-items:center}
.done h2{font-size:clamp(21px,1.4vw + 10px,28px);letter-spacing:-.03em}
.done p{color:var(--ink-2);margin-top:11px;font-size:0.9375rem}
.receipt{max-width:420px;margin:26px auto 0;text-align:left;background:#FAFBFD;border:1px solid var(--line-2);
  border-radius:var(--r-md);padding:16px 18px;font-size:0.875rem}
.receipt div{display:flex;justify-content:space-between;padding:5px 0;color:var(--ink-2)}
.receipt div b{color:var(--ink);font-weight:600}

/* ── 관리자 전용 화면 ── */
.dash-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.dash-head h1{font-size:clamp(20px,1.5vw + 8px,29px);letter-spacing:-.035em}
.dash-head .sub{color:var(--ink-2);font-size:0.875rem;margin-top:5px}
.dash-tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px;font-size:0.9062rem;font-weight:600;color:var(--ink-2);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(10px,1vw,16px);margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(14px,1.3vw,22px)}
.kpi dt{font-size:0.8125rem;color:var(--ink-2);font-weight:600}
.kpi dd{margin:7px 0 0;font-size:clamp(24px,1.5vw + 8px,34px);font-weight:800;letter-spacing:-.045em;line-height:1}
.kpi dd small{font-size:0.875rem;font-weight:600;color:var(--ink-3);letter-spacing:-.01em;margin-left:3px}
.kpi .foot{font-size:0.7875rem;color:var(--ink-3);margin-top:9px}
.kpi .bar{height:4px;border-radius:2px;background:var(--line-2);margin-top:11px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--navy)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(16px,1.6vw,26px)}
.panel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.panel-head h3{font-size:1.0rem;letter-spacing:-.025em}
.panel-head .note{font-size:0.8rem;color:var(--ink-3);margin-left:auto}
.cols-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:clamp(12px,1.2vw,18px)}
.cols-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(12px,1.2vw,18px)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:0.8125rem;color:var(--ink-2);margin-top:14px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}

.stack{display:flex;height:13px;border-radius:3px;overflow:hidden;background:var(--line-2)}
.stack i{display:block;height:100%}
.brow{display:grid;grid-template-columns:minmax(84px,24%) minmax(0,1fr) 46px;gap:11px;align-items:center;padding:6px 0;font-size:0.8438rem}
.brow .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .vl{text-align:right;color:var(--ink-2);font-weight:600}
.bar-t{height:9px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--navy-2);border-radius:3px}

.rank{display:grid;grid-template-columns:20px 1fr auto;gap:11px;align-items:center;padding:7px 0;
  border-bottom:1px solid var(--line-2);font-size:0.875rem}
.rank:last-child{border-bottom:none}
.rank .n{color:var(--ink-3);font-size:0.7812rem;font-weight:700;text-align:right}
.rank .v{font-weight:700;font-variant-numeric:tabular-nums}
.rank .track2{grid-column:2/4;height:5px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:-3px}
.rank .track2 i{display:block;height:100%;background:var(--cobalt)}

/* 히트맵 */
.heat-scroll{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;font-size:clamp(11.5px,0.8vw,13.5px);width:100%}
table.heat th{font-weight:600;color:var(--ink-2);text-align:left;padding:4px 6px;white-space:nowrap}
table.heat thead th{font-size:clamp(10.5px,0.72vw,12.2px);height:clamp(104px,8vw,132px);vertical-align:bottom;padding:0 0 8px}
table.heat thead th div{writing-mode:vertical-rl;text-orientation:upright;text-align:left;
  line-height:1.05;font-weight:600;letter-spacing:-.02em;margin:0 auto}
table.heat tbody th{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line-2)}
table.heat td{width:clamp(24px,1.9vw,36px);height:clamp(24px,1.9vw,36px);text-align:center;border-radius:3px;color:#fff;font-weight:700;
  font-variant-numeric:tabular-nums;background:var(--line-2);cursor:default}
table.heat td.z{color:var(--ink-3);font-weight:400}
.heat-key{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:0.7812rem;color:var(--ink-3)}
.heat-key i{width:20px;height:11px;border-radius:2px;display:block}

/* 클러스터 카드 */
.clusters{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:clamp(12px,1.2vw,18px)}
.cl{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;padding:clamp(15px,1.4vw,22px);position:relative}
.cl.ok{border-color:#BFDCD1;background:linear-gradient(#F6FCFA,#fff 60px)}
.cl-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:13px}
.cl-top h4{font-size:1.0625rem;letter-spacing:-.03em}
.cl-score{margin-left:auto;text-align:right;flex:none}
.cl-score b{font-size:1.3125rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}

  ["renewable","재생에너지 출력 예측",/재생\s*에너지|태양광|풍력/iu,/출력|변동|예측/iu],

  ["chip","반도체 구조·제조",/반도체|웨이퍼|식각|노광|패키징/iu,null],
  ["battery","전지 계면·수명",/전지|배터리/iu,/계면|수명|열화/iu],
  ["robot","로봇 제어·조작",/로봇/iu,/제어|조작|협업/iu],
  ["ai_social","AI의 사회·조직 영향",/인공지능|\bAI\b/iu,/사회|조직|의사결정|책임|윤리|규제/iu],
  ["public_eval","공공정책 평가",/공공\s*정책/iu,/평가/iu],
  ["fair_market","시장 공정성",/공정한\s*시장|시장의\s*공정성/iu,null],
  ["care_general","돌봄체계 연구",/돌봄\s*체계/iu,null],
  ["classics","고전 문헌 연구",/고전\s*문헌/iu,null]

function extractTheme(input){
  const s=clean(input);
  if(!s)return {key:"no_question",label:"질문 미기재",derived:"질문 미기재",method:"missing",evidence:[]};
  for(const [id,label,p,q]of THEMES){
    const m=s.match(p),n=q?s.match(q):null;
    if(m&&(!q||n))return {
      key:id,label,derived:label,method:"rule_candidate",
      evidence:unique([m[0],...(n?[n[0]]:[])])
    };
  }
  // Preserve unmatched content. No invented topic or silent broad-group assignment.
  const exact=C.norm(s).replace(/[?？]\s*$/u,"");
  return {key:"individual-"+key(normalize(s)),label:exact,derived:exact,method:"extractive_unmerged",evidence:[s]};
}
function techAnalysis(text,field,candidate){
  const a=(candidate.fieldAssessments||[]).find(x=>C.fieldName(x.fieldId)===field);
  const categories=[];
  if(a&&a.relations.includes("core_candidate"))categories.push("core");
  if(a&&a.relations.includes("application"))categories.push("connected");
  let reason="";
  if(!clean(text))reason="질문이 입력되지 않았습니다.";
  else if(!a)reason="이 질문에서 선택 기술과 연결되는 표현을 규칙으로 확인하지 못했습니다.";
  else if(!categories.length&&a.relations.includes("linkage"))
    reason="기술을 연구대상으로 다루지만, 기술 자체 개발이나 X에 활용하는 방식은 확인되지 않았습니다.";
  else if(!categories.length)reason="기술 언급은 있으나, 개발·변화 또는 활용 대상 X를 확인하기 어렵습니다.";
  else reason=categories.length===2?"기술개발과 다른 연구대상에의 적용이 함께 명시되어 있습니다.":
    categories[0]==="core"?"원문에 기술 자체의 개발·개선 목표가 기재되어 있습니다. 실제 성과·신규성 검증은 아닙니다.":
    "원문에 선택 기술을 방법으로 활용하는 표현과 연구대상 X가 있습니다.";
  return {categories:categories.length?categories:["pending"],reason,
    evidence:a?(candidate.evidence||[]).filter(e=>(a.evidenceIds||[]).includes(e.id)).map(e=>e.quote):[],
    aiUse:!!(candidate.fieldAssessments||[]).find(x=>x.fieldId==="T07"&&x.relations.includes("application"))
  };
}
function buildDataset(rawRows,options={}){
  if(!Array.isArray(rawRows)||rawRows.length>2000)throw new Error("응답은 최대 2,000건의 배열이어야 합니다.");
  const raw=JSON.parse(JSON.stringify(rawRows)), synthetic=options.synthetic===true;
  const teachers=[],tech=[],issue=[],future=[],warnings=[],counts=new Map();
  raw.forEach(r=>{if(r&&clean(r.id))counts.set(r.id,(counts.get(r.id)||0)+1);});
  raw.forEach((r,index)=>{
    if(!r||typeof r!=="object"||Array.isArray(r)){warnings.push(`입력 ${index+1}행: 응답 객체가 아닙니다.`);return;}
    if(r.intent==="불참")return;
    if(r.intent!=="참여"||!["미래인재","AI 융합인재"].includes(r.track)){warnings.push(`입력 ${index+1}행: 참여 의향·트랙을 확인해 주세요.`);return;}
    const validId=clean(r.id)&&counts.get(r.id)===1,uid=validId?"row-"+key(r.id):"row-"+index+"-"+key(JSON.stringify(r));
    if(clean(r.id)&&!validId)warnings.push(`입력 ${index+1}행: 중복 접수 ID를 자동 병합하지 않았습니다.`);
    const t={uid,sourceIndex:index,legacyId:clean(r.id),name:clean(r.name)||`입력 ${index+1}행`,
      dept:clean(r.dept)||"소속 미기재",college:clean(r.college),track:r.track,synthetic:synthetic&&!!validId,
      techs:strings(r.techs).filter(f=>C.FIELD_NAMES.includes(f)),futureFields:strings(r.futureFields),
      issues:[],raw:r};
    if(strings(r.techs).some(f=>!C.FIELD_NAMES.includes(f)))warnings.push(`${t.name}: 알 수 없는 기술 선택값이 있습니다.`);
    teachers.push(t);
    function entry(text,channel,field,source,meta={}){
      const full=typeof text==="string"?text:"";
      if(full.length>12000){warnings.push(`${t.name}: 12,000자를 넘는 질문을 분석하지 않았습니다.`);return null;}
      return {id:channel+"-"+key(uid+"|"+field+"|"+C.norm(full)),topicUid:"q-"+key(uid+"|"+channel+"|"+C.norm(full)),
        inputRevision:key(full),teacher:t,field,text:full,source,theme:extractTheme(full),placeholder:!full.trim(),...meta};
    }
    if(t.track==="미래인재"){
      const fields=t.futureFields.length?t.futureFields:["분야 미기재"];
      for(const f of fields){
        const e=entry(clean(r.futureTopic),"future",f,"futureTopic",{provenance:t.futureFields.length?"explicit":"missing",categories:[]});
        if(e)future.push(e);
      }
      return;
    }
    const qs=strings(r.topics);
    if(r.topics!==undefined&&!Array.isArray(r.topics))warnings.push(`${t.name}: 19대 질문 배열 형식을 확인해 주세요.`);
    for(const q of qs.length?qs:[""]){
      const c=C.classifyTopic(q);
      for(const f of t.techs){
        const j=JUDGE?JUDGE(q,f):{...techAnalysis(q,f,c),tax:taxonomyMatch(q,f)};
        const e=entry(q,"tech",f,"topics",{candidate:c,provenance:"explicit",aiUse:false,evidence:[],...j});
        if(e)tech.push(e);
      }
    }
    /* 산업·사회: 문항 5-Ⅱ 에 응답자가 직접 쓴 내용만 분석 대상으로 삼는다.
       분야별 질문 연결 정보가 없으므로 공통 질문(topics)과 짝짓지 않는다.
       묶음 이름(issueTheme)과 융복합 유형(fusionType)은 운영 HTML 의 기존 분류 함수가
       계산해 어댑터로 넘겨준 값이다. 이 모듈이 새로 추정하지 않는다. */
    const pText=clean(r.problem);
    const theme=clean(r.issueTheme)||(pText?"미분류":"기재 없음");
    const e2=entry(pText,"issue",theme,"problem",{
      provenance:pText?"written":"missing",linked:true,
      fusion:fusionId(r.fusionType,!!pText),
      categories:[fusionId(r.fusionType,!!pText)],
      reason:pText?"응답자가 문항 5-Ⅱ 에 직접 기재한 내용입니다. 연구 접근의 성격은 판정하지 않습니다."
        :"산업·사회 문제 해결 분야를 기재하지 않았습니다.",
      evidence:[],aiUse:false});
    if(e2){issue.push(e2);t.issues=[theme];}
  });
  if(tech.length+issue.length+future.length>30000)throw new Error("분야·질문 연결이 너무 많습니다. 파일을 나누어 읽어 주세요.");
  return {version:VERSION,engine:ENGINE,id:"snap-"+key(JSON.stringify(raw)),synthetic,
    label:options.label||"로컬 응답",readAt:new Date().toISOString(),raw,teachers,tech,issue,future,warnings};
}
function fieldOptions(data,mode){
  const pool=data[mode]||[], names=mode==="tech"?C.FIELD_NAMES:unique(pool.map(e=>e.field)).sort((a,b)=>a.localeCompare(b,"ko"));
  return names.map(name=>{
    const entries=pool.filter(e=>e.field===name);
    return {name,count:new Set(entries.map(e=>e.teacher.uid)).size,
      provenance:unique(entries.map(e=>e.provenance))};
  });
}
function view(data,mode,field="",category="all",query="",dept=""){
  if(!MODES.some(x=>x.id===mode))mode="future";
  const choices=fieldOptions(data,mode);
  let selected="";
  let pool=data[mode]||[];
  if(mode!=="issue"){
    selected=choices.some(x=>x.name===field)?field:(mode==="tech"?"AI/SW":(choices.find(x=>x.count)||{}).name||"");
    pool=pool.filter(e=>e.field===selected);
  }
  /* 미래인재·산업·사회는 학과 중심으로 읽는다. 목록·CSV·인쇄가 같은 순서를 쓰도록 여기서 정렬한다. */
  if(mode!=="tech")pool=pool.slice().sort((a,b)=>
    a.teacher.dept.localeCompare(b.teacher.dept,"ko")||a.teacher.name.localeCompare(b.teacher.name,"ko"));
  const depts=unique(pool.map(e=>e.teacher.dept)).sort((a,b)=>a.localeCompare(b,"ko"));
  const selectedDept=depts.includes(dept)?dept:"";
  const base=selectedDept?pool.filter(e=>e.teacher.dept===selectedDept):pool;
  const needle=normalize(query);
  const matched=base.filter(e=>!needle||normalize(e.teacher.name+" "+e.teacher.dept+" "+e.text+" "+e.theme.label).includes(needle));
  const typeDefs=TYPES[mode]||[];
  if(category!=="all"&&!typeDefs.some(x=>x.id===category))category="all";
  const entries=matched.filter(e=>category==="all"||e.categories.includes(category));
  const types=typeDefs.map(t=>({ ...t,people:new Set(matched.filter(e=>e.categories.includes(t.id)).map(e=>e.teacher.uid)).size,
    questions:new Set(matched.filter(e=>e.categories.includes(t.id)&&!e.placeholder).map(e=>e.topicUid)).size }));
  const groups=[];
  function close(map){
    for(const g of map.values()){
      g.people=new Set(g.entries.map(e=>e.teacher.uid)).size;
      g.questions=new Set(g.entries.filter(e=>!e.placeholder).map(e=>e.topicUid)).size;
    }
    return Array.from(map.values()).sort((a,b)=>b.people-a.people||b.questions-a.questions||a.label.localeCompare(b.label,"ko"));
  }
  if(mode==="issue"){
    /* 기재 내용의 주제 묶음이 먼저, 융복합 유형은 묶음 안에서 구분한다 */
    const map=new Map();
    for(const e of entries){
      const groupId="theme-"+e.field;
      if(!map.has(groupId))map.set(groupId,{id:groupId,category:"",categoryLabel:"",
        label:e.field,method:"issue_theme",entries:[]});
      map.get(groupId).entries.push(e);
    }
    groups.push(...close(map));
  }else{
    for(const type of typeDefs){
      if(category!=="all"&&category!==type.id)continue;
      const map=new Map();
      for(const e of entries.filter(e=>e.categories.includes(type.id))){
        /* 19대 경로는 공식 중분류가 맞으면 그 이름으로 묶는다 */
        const groupId=type.id+"-"+(e.tax?"tax-"+e.tax.id:e.theme.key);
        if(!map.has(groupId))map.set(groupId,{id:groupId,category:type.id,categoryLabel:type.label,
          label:e.tax?e.tax.name:e.theme.label,method:e.tax?"taxonomy_group":e.theme.method,entries:[]});
        map.get(groupId).entries.push(e);
      }
      groups.push(...close(map));
    }
  }
  const people=Array.from(new Map(entries.map(e=>[e.teacher.uid,e.teacher])).values());
  const unit=data.synthetic&&people.every(t=>t.synthetic)?"명":"건";
  return {dataId:data.id,label:data.label,mode,field:selected,category,query,choices,types,groups,entries,people,
    depts,dept:selectedDept,
    participantCount:people.length,baseParticipants:new Set(base.map(e=>e.teacher.uid)).size,
    questions:new Set(entries.filter(e=>!e.placeholder).map(e=>e.topicUid)).size,
    unit,unlinked:entries.filter(e=>mode==="issue"&&!e.linked).length,
    missingField:mode==="future"&&selected==="분야 미기재",
    provenance:unique(base.map(e=>e.provenance)),
    sourceKind:data.synthetic?"synthetic":"local_unverified",engine:ENGINE,readAt:data.readAt};
}
function exportModel(vm){
  const path=MODES.find(m=>m.id===vm.mode).sub;
  const tail=e=>[e.teacher.uid,e.topicUid,vm.dataId,vm.sourceKind];
  const tailHeads=["교원·응답 연결 ID","주제 ID","기준본","자료 구분"];
  if(vm.mode==="future"){
    return {headers:["분석 경로","학과","교원","연구주제",...tailHeads],
      printCols:[1,2,3],
      rows:vm.entries.map(e=>[path,e.teacher.dept,e.teacher.name,e.text,...tail(e)])};
  }
  if(vm.mode==="issue"){
    const label=id=>(TYPES.issue.find(t=>t.id===id)||{}).label||"";
    const rows=[];
    vm.groups.forEach(g=>g.entries.forEach(e=>rows.push(
      [path,g.label,label(e.fusion),e.teacher.dept,e.teacher.name,e.text,...tail(e)])));
    return {headers:["분석 경로","주제 묶음","융복합 유형","학과","교원","기재 내용",...tailHeads],
      printCols:[1,2,3,4,5],rows};
  }
  const rows=[];
  vm.groups.forEach(g=>g.entries.forEach(e=>rows.push(
    [path,vm.field,g.categoryLabel,g.label,e.tax?e.tax.id+" "+e.tax.name:"중분류 미검출",
     e.teacher.dept,e.teacher.name,e.theme.derived,e.text,
     e.aiUse?"활용 표현 있음":"별도 확인",e.reason||"",...tail(e)])));
  return {headers:["분석 경로","기술 분야","구분","주제 묶음","공식 중분류","학과","교원","도출 주제","원문 질문",
    "AI 활용 명시","판정 근거",...tailHeads],printCols:[2,3,4,5,6,8],rows};
}
return {VERSION,ENGINE,MODES,TYPES,extractTheme,techAnalysis,buildDataset,view,
  fieldOptions,exportModel,setTaxonomy,setTechJudge,runJudge,taxonomyMatch,fusionId,csv:C.toCSV,esc:C.esc,fieldNames:C.FIELD_NAMES};
});
</script>
<script>
/* Three-path results UI. All inputs stay in this browser window. */
(function(root){
"use strict";
const V=root.BK21TopicsV3,E=V.esc;
function create(options={}){
 const state={root:null,data:null,origin:"출처 미확인",loading:false,error:"",sequence:0,
   mode:"future",filters:{tech:{field:"AI/SW",category:"all",q:""},future:{field:"",category:"all",q:"",dept:""},issue:{field:"",category:"all",q:""}},view:null};
 const visible=()=>state.root&&state.root.isConnected;
 function notify(s){if(options.notify)options.notify(s);}
 function loadRows(rows,label="현재 응답",synthetic=false){
   const n=++state.sequence;state.loading=true;state.error="";paint();
   return Promise.resolve().then(()=>V.buildDataset(rows,{label,synthetic})).then(data=>{
     if(n!==state.sequence)return false;
     state.data=data;state.loading=false;
     Object.values(state.filters).forEach(f=>{f.category="all";f.q="";});
     paint();return true;
   }).catch(e=>{
     if(n!==state.sequence)return false;
     state.loading=false;state.error=e.message||"자료 처리 오류";paint();return false;
   });
 }
 /* 자료는 대시보드가 이미 읽어 둔 기준본에서만 가져온다.
    시험용 가상 자료 선택과 파일 읽기는 운영 화면에서 제공하지 않는다. */
 function refresh(){
   const src=(options.getRows?options.getRows():null)||{};
   state.origin=src.origin||"출처 미확인";
   return loadRows(Array.isArray(src.rows)?src.rows:[],src.label||"현재 응답",false);
 }
 function mount(el){state.root=el;return refresh();}
 const selectOptions=(items,value)=>items.map(([k,n])=>`<option value="${E(k)}"${value===k?" selected":""}>${E(n)}</option>`).join("");
 function toolbar(){
   return `<details class="r3-tools" id="r3-tools"><summary>자료·기준 확인</summary>
   <div class="r3-tools-body">
    <p><b>분류·묶음은 제한된 규칙이 만든 초안입니다.</b> 실제 응답에 대한 정확도는 아직 측정하지 않았습니다.
    AI API·승인 저장·사람 검토 기능은 연결하지 않았습니다. 이 화면은 계산을 이 브라우저에서만 수행합니다.</p>
    <p>식별이 검증된 자료가 아니므로 인원이 아닌 <b>응답 건수</b>로 셉니다. 같은 이름을 자동으로 병합하지 않습니다.</p>
    <p><b>원천 기술</b>은 원문에 기술개발·핵심 변화 목표가 적혀 있다는 뜻이며 실제 혁신성·성과의 검증이 아닙니다.
    <b>연계 기술</b>은 선택 기술을 방법으로 써서 다른 연구대상을 다룬다는 표현이 확인된 경우입니다.
    <b>미판정</b>은 부적합·무관·체계 밖이 아니라 현재 규칙으로 관계를 확인하지 못했다는 뜻입니다.</p>
    <p>산업·사회의 <b>문제 진단·원리 규명 / 해결 방안·현장 적용</b>은 확정된 공식 구분이 아니라 검토용 시안입니다.
    제도·서비스 연구에 AI 활용을 요구하지 않습니다.</p>

    분야 명칭은 입력값을 그대로 보존하며 19대 목록은 기존 설문의 목록입니다.</p>
    <p><b>현재 설문에서 확인되지 않는 입력</b>: 미래인재 분야 선택 문항, 산업·사회 분야 선택지, 분야별 개별 질문 연결.

    <p class="r3-small">기준본 ${E(state.data.id)} · ${E(state.data.engine)} · 자료 읽은 시각 ${E(new Date(state.data.readAt).toLocaleString("ko-KR",{timeZone:"Asia/Seoul"}))}</p>
    ${state.data.warnings.length?`<details><summary>입력 확인사항 ${state.data.warnings.length}건</summary><ul>${state.data.warnings.map(w=>`<li>${E(w)}</li>`).join("")}</ul></details>`:""}
   </div></details>`;
 }
 function questionTable(entries,showTheme=true){
   return `<div class="r3-table-wrap"><table class="r3-table"><thead><tr><th>교원 · 소속</th>${showTheme?"<th>도출 주제</th>":""}<th>${state.mode==="future"?"기재한 연구주제":"제출한 질문"}</th></tr></thead><tbody>`+
   entries.map(e=>`<tr data-entry="${E(e.id)}"><td><strong>${E(e.teacher.name)}</strong><small>${E(e.teacher.dept)}</small></td>
   ${showTheme?`<td>${E(e.theme.derived)}</td>`:""}
   <td><p class="r3-original">${E(e.text||"질문 미기재")}</p>
   ${state.mode!=="future"?`<details class="r3-evidence"><summary>분류 근거</summary><p>${E(e.reason)}</p>${e.evidence.length?`<p>근거 표현: ${e.evidence.map(E).join(" / ")}</p>`:""}<p>주제 묶음: ${e.tax?"공식 19대 중분류 "+E(e.tax.id)+" "+E(e.tax.name)+" (kind: "+E(e.tax.kind)+")":e.theme.method==="rule_candidate"?"표현 사전 기반 후보":e.placeholder?"질문 없음":"개별 원문 · 자동 묶지 않음"}${e.tax?" · 대응 표현 "+e.tax.hits.map(E).join(", "):""}</p>
   <p>규칙 판정: ${E(e.classificationLabel||"미판정")} · 기술의 역할: ${E(e.role||"확인 필요")} · 선택 분야 정합성: ${E(e.alignment||"UNCLEAR")}</p>
   <p>신규개발 근거: ${E(e.facts?e.facts.new_technology_evidence:"-")} · 기술개선 근거: ${E(e.facts?e.facts.technology_improvement_evidence:"-")} · 확신도: ${E(e.confidence||"LOW")}</p>
   <p>중분류의 원천·적용 구분은 참고 표시이며, 성격 판정은 원문 근거로만 합니다.</p>${state.mode==="issue"?`<p>연결: ${e.linked?"분야별 질문 입력 기준":"분야·질문 개별 연결 미확인"} · ${e.aiUse?"AI 활용 표현 있음":"AI 활용 여부 별도 확인"}</p>`:""}</details>`:""}</td></tr>`).join("")+
   `</tbody></table></div>`;
 }
 function futureContent(vm){
   if(!vm.entries.length)return empty();
   const title=vm.missingField?"미래인재 참여 교원 목록":`${vm.field} 교원 목록`;
   const per=10,total=vm.entries.length,last=Math.max(1,Math.ceil(total/per));
   const f=state.filters.future;
   if(!f.page||f.page>last)f.page=Math.min(Math.max(1,f.page||1),last);
   const from=(f.page-1)*per,rows=vm.entries.slice(from,from+per);
   const btn=(n,label,on)=>`<button class="r3-page${on?" is-on":""}" data-page="${n}"${on?' aria-current="page"':""}>${label}</button>`;
   const nums=[];for(let i=1;i<=last;i++)nums.push(btn(i,String(i),i===f.page));
   return `<div class="r3-list-head"><h3>${E(title)}</h3><span>${vm.participantCount}${vm.unit}</span></div>
     ${rosterTable(rows,false)}
     ${last>1?`<nav class="r3-pager" aria-label="명단 쪽 이동">
       ${btn(f.page-1,"이전",false).replace('data-page="'+(f.page-1)+'"',f.page>1?'data-page="'+(f.page-1)+'"':"disabled")}
       ${nums.join("")}
       ${btn(f.page+1,"다음",false).replace('data-page="'+(f.page+1)+'"',f.page<last?'data-page="'+(f.page+1)+'"':"disabled")}
       <span class="r3-page-info">${from+1}–${from+rows.length} / 전체 ${total}건 · 내려받기와 인쇄는 전체를 담습니다</span>
     </nav>`:""}`;
 }
 /* 학과 → 교원 → 연구주제 순의 명단표. 같은 학과는 첫 행에만 학과명을 쓴다. */
 function rosterTable(entries,showFusion){
   let last="";
   return `<div class="r3-table-wrap"><table class="r3-table"><thead><tr><th>학과</th><th>교원</th>${showFusion?"<th>융복합 유형</th>":""}<th>${showFusion?"기재 내용":"연구주제"}</th></tr></thead><tbody>`+
   entries.map(e=>{
     const dept=e.teacher.dept,first=dept!==last;last=dept;
     return `<tr data-entry="${E(e.id)}"><td class="r3-dept">${first?E(dept):`<span class="r3-dup">${E(dept)}</span>`}</td>
     <td><strong>${E(e.teacher.name)}</strong></td>
     ${showFusion?`<td>${E(fusionLabel(e.fusion))}</td>`:""}
     <td><p class="r3-original">${E(e.text||"기재 없음")}</p></td></tr>`;
   }).join("")+`</tbody></table></div>`;
 }
 const fusionLabel=id=>((V.TYPES.issue||[]).find(t=>t.id===id)||{}).label||"확인 필요";
 /* 산업·사회: 주제 묶음 → 융복합 유형 → 학과·교원 명단 */
 function issueContent(vm){
   if(!vm.groups.length)return empty();
   return vm.groups.map(g=>{
     const mix=(V.TYPES.issue||[]).map(t=>{
       const n=new Set(g.entries.filter(e=>e.fusion===t.id).map(e=>e.teacher.uid)).size;
       return n?`${t.label} ${n}`:"";
     }).filter(Boolean).join(" · ");
     return `<details class="r3-group" data-group="${E(g.id)}"><summary>
       <span class="r3-group-label">${E(g.label)}<small>${E(mix||"유형 확인 필요")}</small></span>
       <span class="r3-group-count"><b>${g.people}${vm.unit}</b></span><span class="r3-open-text">학과·교원 보기</span>
       </summary><div class="r3-group-body">${rosterTable(g.entries,true)}</div></details>`;
   }).join("");
 }
 function empty(){
   return `<div class="r3-empty"><h3>표시할 응답이 없습니다.</h3><p>다른 분야를 선택하거나 검색어를 지워 주세요. 없다는 사실을 부적합 판정으로 해석하지 않습니다.</p></div>`;
 }
 function groupsContent(vm){
   if(!vm.groups.length)return empty();
   return (V.TYPES[state.mode]||[]).map(type=>{
     const groups=vm.groups.filter(g=>g.category===type.id);if(!groups.length)return "";
     return `<section class="r3-section" data-category="${type.id}"><div class="r3-section-title"><h3>${type.label}</h3><span>${groups.length}개 주제 묶음</span></div>`+
     groups.map(g=>`<details class="r3-group" data-group="${E(g.id)}"><summary>
       <span class="r3-group-label">${E(g.label)}<small>${g.method==="taxonomy_group"?"공식 19대 중분류":g.method==="rule_candidate"?"표현 사전 후보":"개별 주제 · 자동 묶지 않음"}</small></span>
       <span class="r3-group-count"><b>${g.people}${vm.unit}</b><small>질문 ${g.questions}건</small></span><span class="r3-open-text">교원·질문 보기</span>
       </summary><div class="r3-group-body">${questionTable(g.entries,true)}</div></details>`).join("")+`</section>`;
   }).join("");
 }
 function paint(focusId){
   if(!visible())return;
   if(!state.data){
     state.root.innerHTML=`<section class="r3"><h2>결과 분석</h2><p>${E(state.error||"가상 자료를 준비하고 있습니다.")}</p>${state.error?'<button class="r3-button" id="r3-retry">다시 시도</button>':""}</section>`;
     const retry=state.root.querySelector("#r3-retry");if(retry)retry.onclick=()=>refresh();return;
   }
   const f=state.filters[state.mode],vm=V.view(state.data,state.mode,f.field,f.category,f.q,f.dept||"");
   state.view=vm;f.field=vm.field;f.category=vm.category;f.dept=vm.dept;
   const isFuture=state.mode==="future";
   const modeTitle=state.mode==="future"?"미래인재":state.mode==="tech"?"AI 융합인재 · 19대 국가전략기술":"AI 융합인재 · 산업·사회 문제 해결";
   const fieldLabel=vm.mode==="issue"&&vm.provenance.some(x=>x==="legacy_written")?"기재 분야":"분야 선택";
   /* 미래인재는 현재 설문에 분야 선택 문항이 없다.
      실제 분야값이 하나도 없으면 선택기를 감추고 명단만 보여준다.
      분야 문항이 생겨 값이 들어오면 자동으로 다시 나타난다. */
   const noFieldChoice=(isFuture&&vm.choices.every(c=>c.name==="분야 미기재"))||state.mode==="issue";
   const listTitle=state.mode==="issue"?"산업·사회 문제 해결":(noFieldChoice?"미래인재":(vm.field||modeTitle));
   const showDept=isFuture&&vm.depts.length>1;
   state.root.innerHTML=`<section class="r3">
     <header class="r3-header"><div><span class="r3-eyebrow">BK21 · 참여의향 조사</span><h2>결과 분석</h2></div>
       <div class="r3-actions"><button class="r3-button" id="r3-export">현재 목록 내려받기</button><button class="r3-button r3-quiet" id="r3-print">인쇄</button></div></header>
     <p class="r3-context">${E(state.data.label)} · ${E(state.origin)} · 신원 연결 미검증 · ${isFuture?"명단 조회":"자동 분류 초안"}</p>
     <div class="r3-paths" role="tablist" aria-label="결과 분석 경로">
       ${V.MODES.map(m=>`<button id="r3-mode-${m.id}" data-mode="${m.id}" role="tab" aria-selected="${state.mode===m.id}" aria-controls="r3-content" tabindex="${state.mode===m.id?0:-1}"><strong>${m.title}</strong><span>${m.sub}</span></button>`).join("")}
     </div>
     <section id="r3-content" role="tabpanel" aria-labelledby="r3-mode-${state.mode}">
       <div class="r3-selector">${noFieldChoice?"":`<label><span>${fieldLabel}</span><select id="r3-field" aria-label="${fieldLabel}">${vm.choices.length?
         selectOptions(vm.choices.map(x=>[x.name,`${x.name} (${x.count}${vm.unit})`]),vm.field):'<option value="">분야 정보 없음</option>'}</select></label>`}
         ${showDept?`<label><span>학과</span><select id="r3-dept" aria-label="학과 선택">${
           selectOptions([["","학과 전체"],...vm.depts.map(d=>[d,d])],vm.dept)}</select></label>`:""}
         ${state.mode==="issue"?`<label><span>융복합 유형</span><select id="r3-fusion" aria-label="융복합 유형 선택">${
           selectOptions([["all","유형 전체"],...vm.types.map(t=>[t.id,`${t.label} (${t.people}${vm.unit})`])],vm.category)}</select></label>`:""}
       </div>
       ${state.error?`<p class="r3-alert" role="alert">${E(state.error)} 마지막 정상 자료를 유지합니다.</p>`:""}
       ${state.loading?'<p role="status">자료를 읽는 중입니다.</p>':""}
       ${state.mode==="tech"?`<div class="r3-types" aria-label="연구 성격별 보기">${vm.types.map(t=>`<button data-type="${t.id}" aria-pressed="${vm.category===t.id}">
         <span>${t.label}</span><strong>${t.people}<small>${vm.unit}</small></strong><p>${t.desc}</p></button>`).join("")}</div>`:""}
       <div class="r3-list-tools"><p><strong>${E(listTitle)}</strong> · 표시 ${vm.participantCount}${vm.unit} · 유효 질문 ${vm.questions}건</p>
         <label class="r3-search"><span class="sr">주제·이름·소속 검색</span><input id="r3-search" type="search" placeholder="주제·이름·소속 검색" value="${E(f.q)}"></label>
         ${(f.category!=="all"||f.q||f.dept)?'<button class="r3-button r3-quiet" id="r3-reset">전체 보기</button>':""}
       </div>
       ${state.mode==="tech"?'<p class="r3-overlap">같은 교원·질문이 원천과 연계 양쪽에 포함될 수 있습니다. 전체 응답은 중복 없이 셉니다.</p>':""}
       ${isFuture?futureContent(vm):state.mode==="issue"?issueContent(vm):groupsContent(vm)}

 }
 function bind(){
   const q=s=>state.root.querySelector(s),qa=s=>Array.from(state.root.querySelectorAll(s));

       e.preventDefault();const arr=V.MODES.map(x=>x.id),i=arr.indexOf(state.mode);
       state.mode=arr[e.key==="Home"?0:e.key==="End"?2:(i+(e.key==="ArrowRight"?1:2))%3];paint("r3-mode-"+state.mode);
     };
   });
   qa(".r3-pager [data-page]").forEach(b=>b.onclick=()=>{state.filters.future.page=Number(b.dataset.page);paint();});
   const fusionSel=q("#r3-fusion");
   if(fusionSel)fusionSel.onchange=e=>{state.filters[state.mode].category=e.target.value;paint("r3-fusion");};
   const deptSel=q("#r3-dept");
   if(deptSel)deptSel.onchange=e=>{state.filters[state.mode].dept=e.target.value;state.filters.future.page=1;paint("r3-dept");};
   const fieldSel=q("#r3-field");
   if(fieldSel)fieldSel.onchange=e=>{const f=state.filters[state.mode];f.field=e.target.value;f.category="all";f.q="";f.dept="";paint("r3-field");};
   qa("[data-type]").forEach(b=>b.onclick=()=>{const f=state.filters[state.mode];f.category=f.category===b.dataset.type?"all":b.dataset.type;paint();});
   q("#r3-search").oninput=e=>{state.filters[state.mode].q=e.target.value;state.filters.future.page=1;paint("r3-search");};
   if(q("#r3-reset"))q("#r3-reset").onclick=()=>{const f=state.filters[state.mode];f.category="all";f.q="";f.dept="";f.page=1;paint();};
   q("#r3-export").onclick=exportCurrent;
   q("#r3-print").onclick=printCurrent;
 }
 function exportCurrent(){
   if(!state.view)return;
   const model=V.exportModel(state.view),csv=V.csv(model),a=document.createElement("a");
   const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
   const stamp=new Date().toISOString().slice(0,10);
   const seg=(state.view.missingField?"전체명단":state.view.field).replace(/[\/\\:*?"<>|]/g,"_");
   a.href=url;a.download="BK21_결과분석_"+state.mode+"_"+seg+"_"+stamp+".csv";
   document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);
   notify("현재 필터의 명단·주제를 내려받았습니다.");
   return model;
 }
 function printCurrent(){
   if(!state.view)return;
   document.getElementById("r3-print-root")?.remove();
   const vm=state.view,model=V.exportModel(vm),el=document.createElement("div");
   el.id="r3-print-root";el.innerHTML=`<h1>BK21 결과 분석 · ${E(vm.missingField?"미래인재 참여 교원 목록":vm.field)}</h1><p>${E(state.data.label)} · ${E(state.origin)} · 기준본 ${E(vm.dataId)}</p>
     <p>표시 ${vm.participantCount}${vm.unit} · 화면과 같은 조건 · 자동 분류 초안</p>
     <table><thead><tr>${model.printCols.map(i=>`<th>${E(model.headers[i])}</th>`).join("")}</tr></thead><tbody>
     ${model.rows.map(r=>`<tr data-topic-id="${E(r[model.headers.indexOf("주제 ID")])}">${model.printCols.map(i=>`<td>${E(r[i])}</td>`).join("")}</tr>`).join("")}
     </tbody></table>`;
   document.body.appendChild(el);document.body.classList.add("r3-printing");
   const done=()=>{document.body.classList.remove("r3-printing");el.remove();window.removeEventListener("afterprint",done);};
   window.addEventListener("afterprint",done);window.print();return model;
 }
 return {mount,refresh,loadRows,exportCurrent,printCurrent,inspect:()=>state,
   currentExport:()=>state.view?V.exportModel(state.view):null};
}
root.BK21ResultsUI={create};

/* 외부 호스팅에서 Apps Script 를 부를 때 쓰는 통신.
   1순위 fetch POST(단순 요청이라 사전 확인 없이 통과), 실패하면 JSONP 로 재시도한다. */
function jsonp(body) {
  return new Promise(function (res, rej) {
    var cb = "__bk" + Date.now() + Math.floor(Math.random() * 10000);
    var url = REMOTE + "?action=" + encodeURIComponent(body.action) + "&callback=" + cb +
      (body.code ? "&code=" + encodeURIComponent(body.code) : "") +
      (body.data ? "&data=" + encodeURIComponent(JSON.stringify(body.data)) : "");
    var el = document.createElement("script");
    var timer = setTimeout(function () { done(); rej(new Error("서버 응답이 없습니다.")); }, 25000);
    function done() {
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (el.parentNode) el.parentNode.removeChild(el);
    }
    window[cb] = function (data) { done(); res(data); };
    el.onerror = function () { done(); rej(new Error("서버에 연결하지 못했습니다.")); };
    el.src = url;
    document.body.appendChild(el);
  });
}
function callRemote(body) {
  if (typeof fetch !== "function") return jsonp(body);
  return fetch(REMOTE, { method: "POST", body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .catch(function () { return jsonp(body); });
}

function noSpace(t) { return String(t || "").replace(/\s+/g, ""); }
function scoreWords(text, words) {
  var t = noSpace(text), n = 0;
  words.forEach(function (w) {
    var k = noSpace(w);
    if (k && t.indexOf(k) >= 0) n += (k.length >= 4 ? 1.6 : k.length >= 3 ? 1.3 : 1);
  });
  return n;
}

/* 문장을 19대 체계의 '분야 + 중분류'로 찍는다. 해당 없으면 null */
function classifyTech(text) {
  var t = String(text || "");
  if (!t.trim()) return null;
  var best = null, bestScore = 0;
  TAX_ORDER.forEach(function (f) {
    TAXONOMY[f].groups.forEach(function (g) {
      var n = scoreWords(t, g.w);
      if (n > bestScore) { bestScore = n; best = { field: f, id: g.id, group: g.name, kind: g.kind }; }
    });
  });
  return bestScore >= 1 ? best : null;
}

/* 체계 밖일 때 어떤 성격인지 */
function classifyOutside(text) {
  var t = String(text || "");
  var best = "", bestScore = 0;
  OUTSIDE_ORDER.forEach(function (k) {
    var n = scoreWords(t, OUTSIDE_WORDS[k]);
    if (n > bestScore) { bestScore = n; best = k; }
  });
  return bestScore >= 1 ? best : "분류 불가";
}

   "AI로 진단 오류를 줄인다"와 "AI 자체의 한계를 넘는다"는 다른 연구다.
   한국어에서 수단은 대개 '~기반 / ~활용 / ~통해' 앞에 온다.          */
var MEANS_MARKERS = ["기반", "활용", "이용", "통해", "적용", "도입", "접목", "결합", "써서", "사용"];
var AI_TERMS = ["AI-CDSS", "CDSS", "AI", "인공지능", "머신러닝", "딥러닝", "LLM", "언어모델",
  "생성형", "신경망", "기계학습", "빅데이터", "챗봇", "에이전트"];

function splitMeans(text) {
  var obj = " " + String(text || "") + " ";
  var means = [];
  MEANS_MARKERS.forEach(function (m) {
    var guard = 0;
    var i = obj.indexOf(m);
    while (i >= 0 && guard++ < 8) {
      var head = obj.slice(0, i).trim().split(/\s+/);
      var cand = head.slice(-2).join(" ").replace(/[의를을은는이가와과,]$/, "");
      if (cand) means.push(cand);
      obj = obj.slice(0, i) + " " + obj.slice(i + m.length);
      i = obj.indexOf(m);
    }
  });
  return { means: means, object: obj };
}
function hasAI(t) {
  return AI_TERMS.some(function (w) { return String(t || "").indexOf(w) >= 0; });
}
function parseTopic(text) {
  var sp = splitMeans(text);
  var meansThemes = uniq(sp.means.map(classifyTheme)
    .filter(function (x) { return x && x !== "체계 밖"; }));

  /* 수단으로 선언된 말은 대상 판정에서 뺀다.
     그러지 않으면 "생성형 AI와 AI-CDSS를 활용하는 간호실무…" 에서
     꼬리로 남은 '생성형' 때문에 도구가 연구 대상으로 둔갑한다. */
  var objText = sp.object;
  var words = [];
  sp.means.forEach(function (m) { words = words.concat(m.split(/\s+/)); });
  words.forEach(function (w) { if (w.length >= 2) objText = objText.split(w).join(" "); });
  if (sp.means.some(hasAI)) {
    AI_TERMS.forEach(function (w) { objText = objText.split(w).join(" "); });
  }

  var oc = classifyTech(objText);
  return {
    text: text,
    object: oc ? oc.field : "체계 밖",
    objId: oc ? oc.id : "",
    objGroup: oc ? oc.group : classifyOutside(objText),
    objKind: oc ? oc.kind : "",
    means: meansThemes,
    meansText: uniq(sp.means),
    aiRole: sp.means.some(hasAI) ? "수단" : (hasAI(objText) ? "대상" : "")
  };
}

  { k: "임용 초기", w: ["임용", "신임", "부임", "초기"] },
  { k: "학과 사정", w: ["학과", "전공", "학부", "소속"] },
  { k: "업무 부담", w: ["보직", "업무", "바쁘", "시간", "부담"] }
];
function classifyDecline(text) {
  var t = String(text || "");
  if (!t.trim()) return "";
  for (var i = 0; i < DECLINE_TYPES.length; i++) {
    for (var j = 0; j < DECLINE_TYPES[i].w.length; j++) {
      if (t.indexOf(DECLINE_TYPES[i].w[j]) >= 0) return DECLINE_TYPES[i].k;
    }
  }
  return "기타";
}

/* ── 집계 로직 (순수 함수) ────────────────────────────────────────── */
var STOP = ["어떻게","무엇인가","무엇","어디","언제","어떤","얼마","위해","통해","대한","대해","있는가","있는","하는","되는","것인가","것인","것","수","및","등","가능","연구","방법","활용","적용","이하","우리","경우","한다","한가","까지","부터","때문","관련","이러한","그리고","또한","가장","매우","모든","무엇이","어디에","시대","실제","현장","사이","다시","오는","한편",
  "바꾸","늘리","줄이","높이","낮추","만들","이루","다루","가지","지니","이끌","넘어"];
/* 조사·어미를 떼고 명사에 가까운 토큰만 남긴다 (경량 휴리스틱) */
function tokenize(text) {
  return String(text || "").split(/[^가-힣A-Za-z0-9+·]+/).map(function (w) {
    w = w.replace(/(인가|한가|는가|일까|을까|던가)$/, "");
    return w.replace(/(으로써|으로서|이라는|에서의|에게서|으로|에서|에게|라는|들의|와의|과의|의|를|을|은|는|이|가|에|와|과|로|도|만|란)$/, "");
  }).filter(function (w) {
    if (w.length < 2 || /^\d+$/.test(w)) return false;
    if (STOP.indexOf(w) >= 0) return false;
    /* 용언 활용형 제거: ~하는/되는/있는/없는/될/된/한/할 + 종결어미 */
    if (/(하는가|되는가|인가|한가|되어야|되는|하는|있는|없는|이는|지는|오는|가는|나는|되며|하며|한다|된다|이다|였다|졌다|린다|간다|온다|낸다|든다|든가|을까|ㄹ까)$/.test(w)) return false;
    if (w.length >= 3 && /(될|된|한|할|해|져|줄|낼|볼|들|킬|칠|릴|하|되|지|시켜|시킬)$/.test(w)) return false;
    return true;
  });
}

/* 자유 기재된 산업·사회 문제 해결 분야를 예시 4개 범주로 자동 분류 */
function classifyProblem(text) {
  var t = String(text || "").replace(/\s/g, "");
  if (!t) return "";
  if (t.indexOf("인문사회과학기술") >= 0) return "인문사회과학기술융복합";
  if (t.indexOf("인문사회") >= 0) return "인문사회분야융복합";
  if (t.indexOf("과학기술") >= 0) return "과학기술분야융복합";
  if (t.indexOf("인공지능") >= 0 || /AI/i.test(t)) return "인공지능 융합형(AI+X)";
  return "그 밖의 분야 (직접 기재)";
}

function analyze(rows) {
  var a = {
    rows: rows, total: rows.length,
    intent: { "참여": 0, "불참": 0 },
    track: { "미래인재": 0, "AI 융합인재": 0 },
    declines: [], futureTopics: [],
    themes: {}, declineTypes: {}, mismatch: [],
    techAlign: {}, aiRole: { "대상": 0, "수단": 0, "미언급": 0 }, aiAims: {},
    demandObject: {}, selTheme: {}, alignRows: [], issues: {}, issueRows: [],
    byCollege: {}, byDept: {},
    tech: {}, techDept: {}, heat: {},
    fusionType: {},
    keywords: {}, topics: [], daily: [],
    active: []
  };
  rows.forEach(function (r) {
    a.intent[r.intent] = (a.intent[r.intent] || 0) + 1;
    var col = r.college || DEPT_COLLEGE[r.dept] || "기타";
    if (!a.byCollege[col]) a.byCollege[col] = { total: 0, "참여": 0, "불참": 0, depts: [] };
    var c = a.byCollege[col];
    c.total++; c[r.intent]++;
    if (c.depts.indexOf(r.dept) < 0) c.depts.push(r.dept);
    a.byDept[r.dept] = (a.byDept[r.dept] || 0) + 1;
    if (r.intent === "불참") {
      if (r.declineReason) {
        var dt = classifyDecline(r.declineReason);
        a.declines.push({ text: r.declineReason, name: r.name, dept: r.dept, type: dt });
        a.declineTypes[dt] = (a.declineTypes[dt] || 0) + 1;
      }
      return;
    }
    if (r.track) a.track[r.track] = (a.track[r.track] || 0) + 1;
    if (r.track === "미래인재") {
      if (r.futureTopic) {
        var fth = parseTopic(r.futureTopic).object;
        a.futureTopics.push({ text: r.futureTopic, dept: r.dept, college: col, name: r.name, techs: [], theme: fth });
        a.themes[fth] = (a.themes[fth] || 0) + 1;
      }
      tokenize(r.futureTopic).forEach(function (w) { a.keywords[w] = (a.keywords[w] || 0) + 1; });
      return;
    }
    a.active.push(r);
    var ft = classifyProblem(r.problem);
    if (ft) a.fusionType[ft] = (a.fusionType[ft] || 0) + 1;
    (r.techs || []).forEach(function (t) {
      a.tech[t] = (a.tech[t] || 0) + 1;
      if (!a.techDept[t]) a.techDept[t] = [];
      if (a.techDept[t].indexOf(r.dept) < 0) a.techDept[t].push(r.dept);
      if (!a.heat[col]) a.heat[col] = {};
      a.heat[col][t] = (a.heat[col][t] || 0) + 1;
    });
    var myThemes = [];
    (r.topics || []).forEach(function (t) {
      if (!t) return;
      var th = parseTopic(t).object;
      if (th && th !== "체계 밖" && myThemes.indexOf(th) < 0) myThemes.push(th);
      a.themes[th] = (a.themes[th] || 0) + 1;
      a.topics.push({ text: t, dept: r.dept, college: col, name: r.name, techs: r.techs || [], theme: th });
      tokenize(t).forEach(function (w) { a.keywords[w] = (a.keywords[w] || 0) + 1; });
    });
    /* 고른 분야와 실제 연구주제의 대상·수단을 견준다 */
    var parsed = (r.topics || []).map(parseTopic);
    var objThemes = uniq(parsed.map(function (x) { return x.object; })
      .filter(function (x) { return x && x !== "체계 밖"; }));
    var meanThemes = uniq([].concat.apply([], parsed.map(function (x) { return x.means; })));
    objThemes.forEach(function (th) { a.demandObject[th] = (a.demandObject[th] || 0) + 1; });

    var role = parsed.some(function (x) { return x.aiRole === "대상"; }) ? "대상"
      : parsed.some(function (x) { return x.aiRole === "수단"; }) ? "수단" : "미언급";
    a.aiRole[role]++;
    if (role === "수단") {
      objThemes.forEach(function (th) {
        if (th !== "AI·데이터") a.aiAims[th] = (a.aiAims[th] || 0) + 1;
      });
    }

    var judged = [];
    (r.techs || []).forEach(function (tk) {
      var th = TECH_THEME[tk];
      if (!a.techAlign[tk]) a.techAlign[tk] = { sel: 0, tech: 0, fusion: 0, move: 0, check: 0, x: {}, to: {}, g: {} };
      var g = a.techAlign[tk];
      g.sel++;
      /* 같은 문장에서 도구로 쓴 분야는 그 문장의 연구 대상으로 치지 않는다 */
      var own = parsed.filter(function (pt) {
        return pt.object === tk && pt.means.indexOf(tk) < 0;
      });
      var src = own.filter(function (pt) { return pt.objKind === "원천"; });
      var app = own.filter(function (pt) { return pt.objKind === "적용"; });
      var other = parsed.filter(function (pt) {
        return pt.object && pt.object !== "체계 밖" && pt.object !== tk;
      });
      var v, xs = [], gid = "";
      if (src.length) { v = "원천"; gid = src[0].objId + " " + src[0].objGroup; }
      else if (app.length) { v = "적용"; gid = app[0].objId + " " + app[0].objGroup; }
      else if (other.length) {
        v = "타 분야";
        xs = uniq(other.map(function (pt) { return pt.object + (pt.objId ? " · " + pt.objId + " " + pt.objGroup : ""); }));
      } else {
        v = "체계 밖";
        xs = uniq(parsed.map(function (pt) { return pt.objGroup; }).filter(Boolean));
      }
      g[v === "원천" ? "tech" : v === "적용" ? "fusion" : v === "타 분야" ? "move" : "check"]++;
      if (gid.trim()) g.g[gid] = (g.g[gid] || 0) + 1;
      xs.forEach(function (o) {
        if (v === "타 분야") g.to[o] = (g.to[o] || 0) + 1;
        if (v === "체계 밖") g.x[o] = (g.x[o] || 0) + 1;
      });
      judged.push({ tech: tk, v: v, xs: xs, gid: gid });
    });
    /* 선택 기준 영역 인원 (주제 기준 실질 수요와 견주기 위함) */
    uniq((r.techs || []).map(function (x) { return TECH_THEME[x]; }).filter(Boolean))
      .forEach(function (th) { a.selTheme[th] = (a.selTheme[th] || 0) + 1; });
    if (r.problem) {
      var iss = classifyIssue(r.problem) || "미분류";
      a.issues[iss] = (a.issues[iss] || 0) + 1;
      a.issueRows.push({ issue: iss, name: r.name, dept: r.dept, college: col,
        text: r.problem, type: classifyProblem(r.problem), techs: (r.techs || []).join(", ") });
    }
    a.alignRows.push({
      id: r.id, name: r.name, dept: r.dept, college: col,
      techs: (r.techs || []), judged: judged, aiRole: role,
      objThemes: objThemes, meanThemes: meanThemes,
      topics: parsed
    });

    var techThemes = uniq((r.techs || []).map(function (x) { return TECH_THEME[x]; }).filter(Boolean));
    if (techThemes.length && myThemes.length &&
        !techThemes.some(function (x) { return myThemes.indexOf(x) >= 0; })) {
      a.mismatch.push({ id: r.id, name: r.name, dept: r.dept,
        techs: (r.techs || []).join(", "), picked: techThemes.join(", "), wrote: myThemes.join(", ") });
    }
  });

  // 일자별 누적
  var byDay = {};
  rows.forEach(function (r) {
    var d = String(r.submittedAt || "").slice(0, 10);
    if (d) byDay[d] = (byDay[d] || 0) + 1;
  });
  var acc = 0;
  Object.keys(byDay).sort().forEach(function (d) { acc += byDay[d]; a.daily.push({ date: d, n: byDay[d], cum: acc }); });

  var seen = {};
  rows.forEach(function (r) {
    var k = String(r.name || "").trim() + "|" + String(r.dept || "").trim();
    if (!seen[k]) seen[k] = [];
    seen[k].push(r);
  });
  a.dupes = Object.keys(seen).filter(function (k) { return seen[k].length > 1; })
    .map(function (k) { return { label: k.replace("|", " · "), n: seen[k].length }; });

  a.responseRate = pct(a.total, CONFIG.targetCount);
  a.joined = a.intent["참여"];
  a.activeDepts = uniq(rows.filter(function (r) { return r.intent === "참여"; }).map(function (r) { return r.dept; }));
  a.techRank = Object.keys(a.tech).map(function (t) {
    return { tech: t, n: a.tech[t], depts: (a.techDept[t] || []).length };
  }).sort(function (x, y) { return y.n - x.n || y.depts - x.depts; });
  a.themeRank = Object.keys(a.themes).map(function (k) { return { k: k, n: a.themes[k] }; })
    .sort(function (x, y) { return y.n - x.n; });
  a.kwRank = Object.keys(a.keywords).map(function (k) { return { w: k, n: a.keywords[k] }; })
    .filter(function (x) { return x.n > 1; }).sort(function (x, y) { return y.n - x.n; });
  return a;
}

/* 교육연구단 후보 클러스터 */
function clusters(a) {
  return a.techRank.map(function (t) {
    var members = a.active.filter(function (r) { return (r.techs || []).indexOf(t.tech) >= 0; });
    var depts = uniq(members.map(function (m) { return m.dept; }));
    var cols = uniq(members.map(function (m) { return m.college || DEPT_COLLEGE[m.dept]; }));
    var firm = members.filter(function (m) { return m.intent === "참여"; }).length;
    var sizeS = Math.min(1, Math.log(1 + members.length) / Math.log(1 + CONFIG.minFacultyPerUnit * 3));
    var deptS = Math.min(1, depts.length / CONFIG.minDeptsPerUnit);
    var score = Math.round((sizeS * 0.60 + deptS * 0.40) * 100);
    var status = (members.length >= CONFIG.minFacultyPerUnit && depts.length >= CONFIG.minDeptsPerUnit)
      ? "요건 충족" : (members.length >= Math.ceil(CONFIG.minFacultyPerUnit * 0.6) ? "보완 필요" : "형성 초기");
    var topics = [];
    var primary = members.filter(function (m) { return (m.techs || [])[0] === t.tech; });
    primary.concat(members).forEach(function (m) {
      (m.topics || []).forEach(function (x) { if (x && topics.indexOf(x) < 0) topics.push(x); });
    });
    return {
      tech: t.tech, members: members, n: members.length, firm: firm,
      depts: depts, colleges: cols, score: score, status: status,
      topics: topics.slice(0, 3)
    };
  }).sort(function (x, y) { return y.score - x.score || y.n - x.n; });
}

function renderSurvey() {
  if (!S) S = { step: 0, data: blank(), errors: {}, submitting: false };
  var steps = activeSteps();
  if (S.step >= steps.length) S.step = steps.length - 1;
  var cur = steps[S.step];
  app.innerHTML =
  '<div class="wrap"><div class="survey-grid">' +
    '<aside class="rail"><h2>개별 교원 참여의향 조사</h2>' +
      '<p class="rail-sub">5단계 BK21사업</p><nav id="rail"></nav></aside>' +
    '<div class="survey-main">' +
      '<div class="stepbar"><div class="stepbar-in">' +
        '<div class="stepbar-head"><b>' + esc(cur.label) + '</b><span class="num">' + (S.step + 1) + ' / ' + steps.length + '</span></div>' +
        '<div class="track"><div class="track-fill" style="width:' + ((S.step + 1) / steps.length * 100) + '%"></div></div>' +
      '</div></div>' +
      '<div class="card card-form" id="stepbody"></div>' +
      '<div class="btn-row" style="margin-top:20px;justify-content:space-between">' +
        '<button class="btn btn-ghost" id="prev">' + (S.step === 0 ? "표지로" : "이전") + '</button>' +
        '<button class="btn btn-primary btn-lg" id="next">' + (cur.id === "review" ? "응답 제출" : "다음") + '</button>' +
      '</div>' +
    '</div>' +
  '</div></div>';
  paintStep();
  paintRail();
  $("#prev").onclick = function () {
    if (S.step === 0) { go("cover"); return; }
    S.step--; S.errors = {}; renderSurvey(); window.scrollTo(0, 0);
  };
  $("#next").onclick = function () {
    var e = validate(cur.id);
    S.errors = e;
    if (Object.keys(e).length) { paintStep(); var bad = $(".err"); if (bad) bad.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    if (cur.id === "review") return submit();
    S.step++; S.errors = {}; renderSurvey(); window.scrollTo(0, 0);
  };
}

function paintBar() {
  var steps = activeSteps();
  if (S.step >= steps.length) S.step = steps.length - 1;
  var head = $(".stepbar-head");
  if (!head) return;
  head.querySelector("b").textContent = steps[S.step].label;
  head.querySelector("span").textContent = (S.step + 1) + " / " + steps.length;
  $(".track-fill").style.width = ((S.step + 1) / steps.length * 100) + "%";
  var nx = $("#next");
  if (nx) nx.textContent = steps[S.step].id === "review" ? "응답 제출" : "다음";
  paintRail();
}
function paintRail() {
  var rail = $("#rail");
  if (!rail) return;
  var steps = activeSteps();
  rail.innerHTML = steps.map(function (st, i) {
    var state = i < S.step ? "done" : "";
    return '<button class="rail-item ' + state + '" data-rstep="' + i + '"' +
      (i === S.step ? ' aria-current="step"' : "") + (i > S.step ? " disabled" : "") + ">" +
      '<span class="n">' + (i < S.step ? "✓" : (i + 1)) + "</span>" + esc(st.label) + "</button>";
  }).join("");
  $$("[data-rstep]", rail).forEach(function (b) {
    b.onclick = function () {
      var i = Number(b.dataset.rstep);
      if (i >= S.step) return;
      S.step = i; S.errors = {}; renderSurvey(); window.scrollTo(0, 0);
    };
  });
}
function paintStep(focusSel) {
  var steps = activeSteps(), cur = steps[S.step];
  var box = $("#stepbody");
  if (!box) return;
  paintBar();
  box.innerHTML = ({ basic: stepBasic, intent: stepIntent, track: stepTrack, future: stepFuture,
    topics: stepTopics, fields: stepFields, review: stepReview })[cur.id]();
  bindStep();
  if (focusSel) { var f = $(focusSel, box); if (f) f.focus(); }
}
function bindStep() {
  var box = $("#stepbody");
  $$("[data-k]", box).forEach(function (el) {
    if (el.tagName === "SELECT") el.onchange = function () {
      setVal(el.dataset.k, el.value);
      if (el.dataset.k === "college") { S.data.dept = ""; S.data.deptEtc = ""; delete S.errors.college; }
      paintStep(el.dataset.k === "college" ? '[data-k="dept"]' : null);
    };
    else el.oninput = function () { setVal(el.dataset.k, el.value); if (el.dataset.live) paintLive(el); };
  });
  $$("[data-pick]", box).forEach(function (el) {
    el.onclick = function () {
      var g = el.dataset.pick, v = el.dataset.v;
      if (g === "intent") { S.data.intent = v; if (v === "불참") { S.data.track = ""; } }
      else if (g === "track") S.data.track = v;
      else if (g === "tech") {
        var i = S.data.techs.indexOf(v);
        if (i >= 0) S.data.techs.splice(i, 1); else S.data.techs.push(v);
      } else if (g === "topicfill") {
        var slot = S.data.topics.findIndex(function (t) { return !t.trim(); });
        if (slot < 0) slot = 0;
        S.data.topics[slot] = v;
      }
      delete S.errors[g === "tech" ? "techs" : g];
      paintStep('[data-pick="' + g + '"][data-v="' + (window.CSS && CSS.escape ? CSS.escape(v) : v) + '"]');
    };
  });
  var db = $("#domBack", box);
  if (db) db.onclick = function () {
    S.data.emailDomain = EMAIL_DOMAINS[0];
    S.data.emailDomainEtc = "";
    paintStep('[data-k="emailDomain"]');
  };
  $$("[data-jump]", box).forEach(function (el) {
    el.onclick = function () {
      var id = el.dataset.jump, steps = activeSteps();
      var i = steps.findIndex(function (s) { return s.id === id; });
      if (i >= 0) { S.step = i; S.errors = {}; renderSurvey(); window.scrollTo(0, 0); }
    };
  });
}
function paintLive(el) {
  if (el.dataset.live === "email") {
    var pv = $("#emailPreview");
    if (pv) pv.textContent = emailValue() ? emailValue() + " 로 접수증을 보내드립니다." : "";

  var bad = v.length > 5 && !/[?？]\s*$/.test(v);

}

function submit() {
  if (S.submitting) return;
  var ids = ["basic", "intent", "track", "future", "topics", "fields"], all = {};
  activeSteps().forEach(function (s) {
    if (ids.indexOf(s.id) < 0) return;
    var e = validate(s.id);
    Object.keys(e).forEach(function (k) { all[k] = e[k]; });
  });
  if (Object.keys(all).length) {
    S.errors = all;
    var steps = activeSteps();
    for (var i = 0; i < steps.length; i++) {
      if (Object.keys(validate(steps[i].id)).length) { S.step = i; break; }
    }
    renderSurvey(); toast("빠진 항목이 있어 해당 화면으로 이동했습니다."); return;
  }
  S.submitting = true;
  var btn = $("#next"); if (btn) { btn.disabled = true; btn.textContent = "제출 중…"; }
  var d = S.data;
  var payload = {
    name: d.name.trim(), dept: deptValue(), college: d.college || DEPT_COLLEGE[deptValue()] || "기타",
    rank: d.rank, email: emailValue(), intent: d.intent,
    declineReason: d.intent === "불참" ? d.declineReason.trim() : "",
    track: d.intent === "불참" ? "" : d.track,
    futureTopic: d.track === "미래인재" ? d.futureTopic.trim() : "",
    topics: d.track === "AI 융합인재" ? d.topics.map(function (t) { return t.trim(); }).filter(Boolean) : [],
    techs: d.track === "AI 융합인재" ? d.techs.slice() : [],
    problem: d.track === "AI 융합인재" ? d.problem.trim() : "",
    coreField: d.track === "AI 융합인재" ? d.coreField.trim() : "",
    vision: d.track === "AI 융합인재" ? d.vision.trim() : ""
  };
  Backend.submit(payload).then(function (res) {
    S.receipt = { id: (res && res.id) || "-", at: new Date(), name: payload.name, intent: payload.intent, email: payload.email };
    cache = null;
    go("done");
  }).catch(function (err) {
    S.submitting = false;
    if (btn) { btn.disabled = false; btn.textContent = "응답 제출"; }
    toast("제출에 실패했습니다. 잠시 후 다시 시도해 주세요.");
    console.error(err);
  });
}

/* 표를 10개씩 끊어 보여주는 페이지 버튼 */
function pager(key, total) {
  var last = Math.max(1, Math.ceil(total / PER_PAGE));
  if (page[key] > last) page[key] = last;
  var cur = page[key];
  var from = total ? (cur - 1) * PER_PAGE + 1 : 0;
  var to = Math.min(cur * PER_PAGE, total);
  var nums = [];
  if (last <= 9) { for (var i = 1; i <= last; i++) nums.push(i); }
  else {
    nums.push(1);
    var a = Math.max(2, cur - 2), b = Math.min(last - 1, cur + 2);
    if (a > 2) nums.push("…");
    for (var j = a; j <= b; j++) nums.push(j);
    if (b < last - 1) nums.push("…");
    nums.push(last);
  }
  var h = '<div class="pager">' +
    '<button data-page="' + key + ':' + (cur - 1) + '"' + (cur === 1 ? " disabled" : "") + ' aria-label="이전">‹</button>' +
    nums.map(function (n) {
      if (n === "…") return '<span class="dots">…</span>';
      return '<button data-page="' + key + ":" + n + '"' + (n === cur ? ' aria-current="page"' : "") + ">" + n + "</button>";
    }).join("") +
    '<button data-page="' + key + ':' + (cur + 1) + '"' + (cur === last ? " disabled" : "") + ' aria-label="다음">›</button>' +
    "</div>" +
    '<p class="pager-info">' + (total ? from + "–" + to : 0) + " / 전체 " + total + "건</p>";
  return h;
}
function slicePage(key, list) {
  var last = Math.max(1, Math.ceil(list.length / PER_PAGE));
  if (page[key] > last) page[key] = last;
  return list.slice((page[key] - 1) * PER_PAGE, page[key] * PER_PAGE);
}
function bindPager() {
  $$("[data-page]").forEach(function (b) {
    b.onclick = function () {
      var v = b.dataset.page.split(":");
      page[v[0]] = Math.max(1, Number(v[1]));
      paintTab();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  });
}

function spark(daily) {
  if (!daily.length) return '<p class="hint">아직 응답이 없습니다.</p>';
  var w = 100, h = 42, maxc = daily[daily.length - 1].cum;
  var pts = daily.map(function (d, i) {
    var x = daily.length === 1 ? 0 : (i / (daily.length - 1)) * w;
    var y = h - (d.cum / (maxc || 1)) * (h - 4) - 2;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  return '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" style="width:100%;height:64px;display:block" aria-hidden="true">' +
    '<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--navy-2)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>' +
    '<polyline points="0,' + h + " " + pts.join(" ") + " " + w + "," + h + '" fill="rgba(47,111,208,.10)" stroke="none"/></svg>' +
    '<div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--ink-3);margin-top:6px">' +
    "<span>" + fmtDate(daily[0].date) + "</span><span>" + fmtDate(daily[daily.length - 1].date) + " · 누적 " + maxc + "명</span></div>";
}

function bindTopics() {
  var q = $("#tq");
  if (q) q.oninput = debounce(function () { filters.q = q.value; page.topics = 1; paintTab(); var f = $("#tq"); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }, 260);

  var c = $("#tclear");

function debounce(fn, ms) {
  var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); };
}

function tabResponses() {

    '<select class="input" id="rintent"><option value="">의향 전체</option>' +
    INTENTS.map(function (i) { return '<option' + (filters.intent === i ? " selected" : "") + ">" + esc(i) + "</option>"; }).join("") + "</select>" +
    '<select class="input" id="rtrack"><option value="">트랙 전체</option>' +

    '<select class="input" id="rcollege"><option value="">단과대학·대학원 전체</option>' +
    Object.keys(COLLEGES).map(function (c) { return '<option' + (filters.college === c ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("") + "</select>" +
    '<span style="color:var(--ink-3);font-size:0.8125rem;margin-left:auto" class="num">' + list.length + " / " + A.total + "건</span></div>" +
    (list.length ? '<div class="tbl-wrap"><table class="data"><thead><tr>' +
      "<th>접수일</th><th>성명</th><th>소속 학과</th><th>직급</th><th>의향</th><th>트랙</th><th>전략기술</th><th></th>" +
      "</tr></thead><tbody>" + slicePage("responses", list).map(function (r) {
        return '<tr><td class="num" style="color:var(--ink-3)">' + String(r.submittedAt || "").slice(5, 10).replace("-", ".") + "</td>" +
          "<td>" + esc(r.name) + "</td><td>" + esc(r.dept) + "</td><td>" + esc(r.rank) + "</td>" +
          "<td>" + intentTag(r.intent) + "</td>" +
          "<td>" + (r.track ? '<span class="st"><i style="background:' + TRACK_COLOR[r.track] + '"></i>' + esc(r.track) + "</span>" : "-") + "</td>" +

}

var JUDGE_COLOR = { "기술": "var(--go)", "융합": "var(--cobalt)", "재배치": "var(--hold)", "확인": "var(--off)" };
var JUDGE_DESC = {
  "기술": "그 분야 자체를 연구 대상으로 삼음",
  "융합": "그 분야를 도구로 다른 영역을 연구",
  "재배치": "주제가 다른 분야에 가까움",
  "확인": "주제가 없거나 판정이 어려움"
};

/* ── 결과 분석 탭 ────────────────────────────────────────────────
   세 경로(미래인재 / 19대 국가전략기술 / 산업·사회 문제 해결)를 위에 두고,
   기존 정합성 분석 화면은 지우지 않고 아래 접힘 영역에 보존한다.        */
function tabAnalysis() {
  return '<section id="bk21-results-root" aria-label="결과 분석 세 경로"></section>';
}

/* 기존 화면: 코드·판정 로직을 바꾸지 않고 이름만 분리했다 */
function tabAnalysisLegacy() {
  if (!A.alignRows.length) return '<div class="card empty-state"><b>분석할 응답이 없습니다.</b>' +
    "<p>AI 융합인재 트랙 응답이 들어오면 여기에 표시됩니다.</p></div>";

  var AX = [["tech", "19대 전략기술"], ["issue", "산업·사회 문제"]];
  var head = '<div class="tabs" style="margin-bottom:18px">' + AX.map(function (x) {
    return '<button class="tab" data-axis="' + x[0] + '" aria-selected="' + (filters.axis === x[0]) + '">' + x[1] + "</button>";
  }).join("") + "</div>";
  return head + (filters.axis === "issue" ? axisIssue() : axisTech());

/* ── 축 1. 19대 전략기술 ─────────────────────────────────────────── */
function axisTech() {
  var rank = Object.keys(A.techAlign).map(function (k) {
    var v = A.techAlign[k];
    return { k: k, sel: v.sel, tech: v.tech, fusion: v.fusion, move: v.move, check: v.check };
  }).sort(function (x, y) { return y.sel - x.sel; });
  var maxSel = rank.length ? rank[0].sel : 1;
  if (!filters.atech && rank.length) filters.atech = rank[0].k;

  var cur = A.techAlign[filters.atech] || { sel: 0, tech: 0, fusion: 0, move: 0, check: 0, x: {}, to: {} };
  var name = filters.atech;
  var members = A.alignRows.filter(function (r) { return r.techs.indexOf(filters.atech) >= 0; })
    .map(function (r) {
      var j = r.judged.filter(function (x) { return x.tech === filters.atech; })[0] || { v: "체계 밖", xs: [] };
      return { r: r, v: j.v, xs: j.xs || [], gid: j.gid || "" };
    })
    .sort(function (x, y) {
      var o = { "원천": 0, "적용": 1, "타 분야": 2, "체계 밖": 3 };
      return o[x.v] - o[y.v] || x.r.dept.localeCompare(y.r.dept);
    });
  var shown = members.filter(function (m) { return !filters.judge || m.v === filters.judge; });

  var tax = TAXONOMY[filters.atech];
  function bars(obj, color) {
    var list = Object.keys(obj).map(function (k) { return { k: k, n: obj[k] }; })
      .sort(function (x, y) { return y.n - x.n; }).slice(0, 7);
    var mx = list.length ? list[0].n : 1;
    return list.length ? list.map(function (x) { return barRow(x.k, x.n, mx, color); }).join("") : "";
  }

  return '<div class="cols-2" style="margin-bottom:16px">' +
    /* 왼쪽: 분야 목록이자 선택기 */
    '<div class="panel"><div class="panel-head"><h3>분야별 구성</h3>' +
    '<span class="note">눌러서 오른쪽을 바꿉니다</span></div>' +
    rank.map(function (x) {
      return '<button class="brow" data-atech="' + esc(x.k) + '" style="width:100%;text-align:left' +
        (filters.atech === x.k ? ";background:#F5F8FD;border-radius:6px" : "") + '">' +
        '<span class="nm"' + (filters.atech === x.k ? ' style="color:var(--navy);font-weight:700"' : "") + ">" + esc(x.k) + "</span>" +
        '<span style="display:block;width:' + Math.max(10, x.sel / maxSel * 100) + '%"><span class="stack" style="height:11px">' +
        '<i style="width:' + pct(x.tech, x.sel) + '%;background:var(--go)"></i>' +
        '<i style="width:' + pct(x.fusion, x.sel) + '%;background:var(--cobalt)"></i>' +
        '<i style="width:' + pct(x.move, x.sel) + '%;background:var(--hold)"></i>' +
        '<i style="width:' + pct(x.check, x.sel) + '%;background:var(--off)"></i></span></span>' +
        '<span class="vl num">' + x.sel + "</span></button>";
    }).join("") +
    '<div class="legend" style="margin-top:14px">' + VERDICTS.map(function (v) {
      return '<span><i style="background:' + v.color + '"></i>' + v.k + "</span>";
    }).join("") + "</div></div>" +

    /* 오른쪽: 선택한 분야의 속사정 */
    '<div class="panel"><div class="panel-head"><h3>' + esc(name) + " · " + cur.sel + "명</h3>" +
    '<span class="note">연구주제로 본 판정</span></div>' +
    (tax ? '<div class="notice" style="margin-bottom:16px;font-size:0.8125rem"><span><b>분야별 개념</b> ' +
      esc(tax.concept) + "<br><b>범주화 기준</b> " + esc(tax.basis) + "</span></div>" : "") +
    '<dl class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">' +
      '<div class="kpi"><dt>① 원천</dt><dd class="num" style="color:var(--go)">' + cur.tech +
      '<small>명</small></dd><p class="foot">' + pct(cur.tech, cur.sel) + "%</p></div>" +
      '<div class="kpi"><dt>② 적용</dt><dd class="num" style="color:var(--cobalt)">' + cur.fusion +
      '<small>명</small></dd><p class="foot">' + pct(cur.fusion, cur.sel) + "%</p></div>" +
      '<div class="kpi"><dt>③ 타 분야</dt><dd class="num" style="color:var(--hold)">' + cur.move +
      '<small>명</small></dd><p class="foot">' + pct(cur.move, cur.sel) + "%</p></div>" +
      '<div class="kpi"><dt>④ 체계 밖</dt><dd class="num" style="color:var(--off)">' + cur.check +
      '<small>명</small></dd><p class="foot">' + pct(cur.check, cur.sel) + "%</p></div></dl>" +
    '<h5 style="font-size:0.7812rem;color:var(--ink-3);margin:0 0 8px;font-weight:700">①② 어느 중분류에 해당하는가</h5>' +
    (bars(cur.g, "var(--go)") || '<p class="hint">이 분야 세부기술에 해당하는 주제가 없습니다.</p>') +
    '<h5 style="font-size:0.7812rem;color:var(--ink-3);margin:18px 0 8px;font-weight:700">③ 타 분야라면 어디로</h5>' +
    (bars(cur.to, "var(--hold)") || '<p class="hint">타 분야 판정이 없습니다.</p>') +
    '<h5 style="font-size:0.7812rem;color:var(--ink-3);margin:18px 0 8px;font-weight:700">④ 체계 밖이라면 어떤 성격인가</h5>' +
    (bars(cur.x, "var(--off)") || '<p class="hint">체계 밖 판정이 없습니다.</p>') + "</div>" +
  "</div>" +
  verdictPanel() +

  adjustedPanel() +

  '<div class="panel"><div class="panel-head"><h3>' + esc(name) + " 선택 교원 명단</h3>" +
    '<span class="note">' + shown.length + "명</span></div>" +
    '<div class="tbl-tools">' +
    '<select class="input" id="ajudge"><option value="">성격 전체</option>' +
    ["원천", "적용", "타 분야", "체계 밖"].map(function (v) { return '<option' + (filters.judge === v ? " selected" : "") + ">" + v + "</option>"; }).join("") + "</select>" +
    (filters.judge ? '<button class="btn btn-quiet" id="aclear">필터 지우기</button>' : "") +
    '<button class="btn btn-ghost" id="acsv" style="margin-left:auto">이 명단 CSV</button></div>' +
    (shown.length ? '<div class="tbl-wrap"><table class="data" style="min-width:820px"><thead><tr>' +
      "<th>판정</th><th>성명</th><th>소속 학과</th><th>직급</th><th>해당 중분류 · 타 분야</th><th style=\"width:38%\">연구주제와 판단 근거</th>" +
      "</tr></thead><tbody>" +
      slicePage("analysis", shown).map(function (m) {
        var r = m.r;
        return '<tr><td><span class="chip chip-sm" style="cursor:default;border-color:' + JUDGE_COLOR[m.v] +
          ';color:' + JUDGE_COLOR[m.v] + '">' + m.v + "</span></td>" +
          "<td>" + esc(r.name) + "</td><td>" + esc(r.dept) + "</td><td>" + esc(rankOf(r.id)) + "</td>" +
          "<td>" + (m.gid && m.gid.trim() ? '<span class="chip chip-sm" style="cursor:default">' + esc(m.gid) + "</span>"
            : m.xs.length ? m.xs.map(function (o) {
              return '<div style="margin-bottom:3px;font-size:0.8rem">' + esc(o) + "</div>";
            }).join("") : '<span style="color:var(--ink-3)">-</span>') + "</td>" +
          "<td>" + (r.topics.length ? r.topics.map(function (t) {
            return '<div style="margin-bottom:7px">' + esc(t.text) +
              '<div style="font-size:0.75rem;color:var(--ink-3);margin-top:2px">대상 ' + esc(t.object) +
              (t.objId ? " " + esc(t.objId + " " + t.objGroup) : t.objGroup ? " (" + esc(t.objGroup) + ")" : "") +
              (t.meansText.length ? " · 수단 " + esc(t.meansText.join(", ")) : "") + "</div></div>";
          }).join("") : '<span style="color:var(--ink-3)">주제 없음</span>') + "</td></tr>";
      }).join("") + "</tbody></table></div>" + pager("analysis", shown.length)
      : '<div class="empty-state"><b>해당하는 교원이 없습니다.</b></div>') + "</div>";
}
