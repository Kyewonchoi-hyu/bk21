<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5단계 BK21 교원 참여의향 조사</title>
<style>
:root{
  --navy:#0A2A4E; --navy-2:#14477E; --cobalt:#2F6FD0; --cobalt-soft:#E9F0FB;
  --ink:#101720; --ink-2:#57626F; --ink-3:#8C97A4;
  --line:#DCE2EA; --line-2:#EDF1F5;
  --paper:#F3F5F8; --card:#FFFFFF;
  --go:#1B6F55; --go-soft:#E4F2ED;
  --hold:#A9711A; --hold-soft:#FBF0DC;
  --off:#7C8794; --off-soft:#EEF0F3;
  --danger:#B23A38;
  --r-lg:12px; --r-md:9px; --r-sm:6px;
  --shadow:0 1px 2px rgba(16,23,32,.05), 0 8px 24px -16px rgba(16,23,32,.35);
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(14.8px, 0.28vw + 13.2px, 17px)}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--paper); color:var(--ink);
  font-size:1rem; line-height:1.62; -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 0;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--navy-2)}
h1,h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.02em;font-weight:700}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 공통 상단 룰: 조사 공문의 이중선 모티프 (딱 한 번만 사용) ── */
.masthead{background:var(--navy);color:#fff;border-bottom:3px solid var(--cobalt)}
.masthead-in{max-width:1440px;margin:0 auto;padding:clamp(12px,1.1vw,17px) clamp(16px,2.8vw,40px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wordmark{font-weight:800;letter-spacing:-.03em;font-size:0.9375rem}
.wordmark span{opacity:.62;font-weight:500;margin-left:8px;letter-spacing:0}
.masthead-nav{margin-left:auto;display:flex;gap:6px}
.masthead-nav button{color:#C9D6E6;font-size:0.8438rem;padding:6px 12px;border-radius:999px;font-weight:600}
.masthead-nav button:hover{color:#fff;background:rgba(255,255,255,.1)}
.masthead-nav button[aria-current="page"]{color:var(--navy);background:#fff}

/* ── 레이아웃 ── */
.wrap{max-width:1440px;margin:0 auto;padding:clamp(20px,2.4vw,36px) clamp(16px,2.8vw,40px) 90px}
.wrap-narrow{max-width:900px}
.wrap-tight{max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(17px,1.7vw,24px)}
.grid{display:grid;gap:16px}
@media(max-width:720px){.card{padding:clamp(15px,3.6vw,20px)}}

/* ── 설문: 표지 ── */
.hero{background:var(--navy);color:#fff;min-height:calc(100vh - 57px);display:flex;align-items:center}
.hero-in{width:100%;max-width:1440px;margin:0 auto;padding:clamp(44px,5.4vw,84px) clamp(18px,3vw,44px);
  display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,4.4vw,72px);align-items:center}
.cover-kicker{font-size:clamp(12.5px,0.9vw,14px);color:#9FBBDD;font-weight:600;margin-bottom:clamp(12px,1.4vw,20px)}
.hero h1{font-size:clamp(30px,4.4vw,62px);text-wrap:balance;letter-spacing:-.05em;line-height:1.1;font-weight:800}
.hero-rule{margin-top:clamp(24px,3vw,40px);width:min(100%,420px);border-top:1px solid rgba(255,255,255,.3);
  border-bottom:3px solid rgba(255,255,255,.3);height:4px}
.hero-card{background:#fff;color:var(--ink);border-radius:16px;padding:clamp(24px,3vw,48px);
  box-shadow:0 40px 80px -40px rgba(0,0,0,.55)}
.cover-lead{color:var(--ink);text-wrap:pretty;font-size:clamp(15.2px,0.5vw + 14px,18px);line-height:1.68;letter-spacing:-.01em}
.meta-rows{margin:30px 0 34px;border-top:1px solid var(--line-2)}
.meta-row{display:flex;gap:20px;padding:15px 2px;border-bottom:1px solid var(--line-2);font-size:0.9375rem}
.meta-row dt{width:64px;flex:none;color:var(--ink-3);font-weight:600}
.meta-row dd{margin:0;color:var(--ink);line-height:1.6}
@media(max-width:1080px){
  .hero{min-height:0}
  .hero-in{grid-template-columns:1fr}
  .hero-rule{margin-top:24px}
}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:var(--r-md);font-weight:700;font-size:0.9062rem;
  border:1px solid transparent;transition:background .12s ease,border-color .12s ease}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-quiet{color:var(--ink-2);padding:11px 12px;font-weight:600}
.btn-quiet:hover{color:var(--ink)}
.btn-lg{padding:14px 26px;font-size:1.0rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ── 진행 표시 ── */
.stepbar{position:sticky;top:0;z-index:20;background:rgba(243,245,248,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);margin:0 calc(-1 * clamp(16px,2.8vw,40px)) 20px;
  padding:12px clamp(16px,2.8vw,40px)}
.stepbar-in{margin:0 auto}
.stepbar-head{display:flex;justify-content:space-between;align-items:baseline;font-size:0.8125rem;color:var(--ink-2);margin-bottom:8px}
.stepbar-head b{color:var(--ink);font-size:0.9062rem;font-weight:700;letter-spacing:-.01em}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.track-fill{height:100%;background:var(--navy);transition:width .28s cubic-bezier(.2,.7,.3,1)}

/* ── 설문 2단 레이아웃 ── */
.survey-grid{display:grid;grid-template-columns:minmax(200px,clamp(200px,17vw,270px)) minmax(0,1fr);
  gap:clamp(28px,3.6vw,60px);align-items:start;max-width:1280px;margin:0 auto}
.survey-main{min-width:0}
.rail{position:sticky;top:28px}
.rail h2{font-size:0.9375rem;letter-spacing:-.025em;color:var(--ink);margin-bottom:4px}
.rail .rail-sub{font-size:0.8125rem;color:var(--ink-3);margin-bottom:20px}
.rail-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  padding:11px 13px;border-radius:9px;color:var(--ink-3);font-weight:600;font-size:0.9062rem;
  transition:color .12s,background .12s}
.rail-item .n{width:25px;height:25px;border-radius:50%;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:0.75rem;background:#fff;font-weight:700}
.rail-item.done{color:var(--ink-2)}
.rail-item.done .n{background:var(--go-soft);border-color:#BFDCD1;color:var(--go)}
.rail-item.done:hover{color:var(--ink);background:#fff}
.rail-item[aria-current="step"]{color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.rail-item[aria-current="step"] .n{background:var(--navy);border-color:var(--navy);color:#fff}
.rail-item:disabled{cursor:default}
.card-form{padding:clamp(20px,2.4vw,38px)}
@media(min-width:961px){.stepbar{display:none}}
@media(max-width:960px){
  .survey-grid{grid-template-columns:1fr;gap:0;max-width:840px}
  .rail{display:none}
}

/* ── 폼 ── */
.q{padding:clamp(20px,2.1vw,32px) 0;border-bottom:1px solid var(--line-2)}
.q:first-child{padding-top:4px}
.q:last-child{border-bottom:none;padding-bottom:6px}
.q-title{font-size:clamp(16.4px,0.5vw + 15px,19.5px);font-weight:700;letter-spacing:-.025em;display:flex;gap:9px;align-items:baseline}
.q-title .idx{flex:none;font-weight:800;font-size:0.75rem;color:var(--navy);
  background:var(--cobalt-soft);padding:3px 9px;border-radius:6px;position:relative;top:-1px}
.q-major{border-bottom:none}
.q-major + .q-major{border-top:1px solid var(--line)}
.q-help{color:var(--ink-2);font-size:clamp(13.4px,0.3vw + 12.8px,15.4px);margin-top:8px;text-wrap:pretty}
.q-body{margin-top:16px}
.field{display:block;margin-bottom:14px}
.field-label{display:block;font-size:0.8438rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input,select.input,textarea.input{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-md);
  background:#fff;font-size:0.9375rem;transition:border-color .12s}
.input:hover{border-color:#C3CCD8}
.input:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
textarea.input{resize:vertical;min-height:92px;line-height:1.65}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%2357626F' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:36px}
.row-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(10px,1.1vw,16px)}
.email-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.05fr);gap:9px;align-items:center}
@media(max-width:420px){.email-row{grid-template-columns:1fr;gap:7px}.email-row .at{display:none}}
.email-row .at{color:var(--ink-3);font-weight:700}
.hint{font-size:0.8125rem;color:var(--ink-3);margin-top:6px}
.err{font-size:0.8125rem;color:var(--danger);margin-top:6px;font-weight:600}
.warn{font-size:0.8rem;color:var(--hold);margin-top:5px}
.input.is-bad{border-color:var(--danger);background:#FFFAFA}

/* 선택 카드 (참여 의향) */
.choices{display:grid;gap:10px}
.choice{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;border:1px solid var(--line);
  border-radius:var(--r-md);background:#fff;text-align:left;width:100%;transition:border-color .12s,background .12s}
.choice:hover{border-color:#B9C4D2}
.choice[aria-pressed="true"]{border-color:var(--navy);background:#F7FAFE;box-shadow:inset 0 0 0 1px var(--navy)}
.choice .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid #B9C4D2;flex:none;margin-top:2px;position:relative}
.choice[aria-pressed="true"] .dot{border-color:var(--navy)}
.choice[aria-pressed="true"] .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--navy)}
.choice b{display:block;font-size:0.9688rem;letter-spacing:-.02em}
.choice small{display:block;color:var(--ink-2);font-size:0.8438rem;margin-top:3px;line-height:1.5}
.choice-inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.choice-inline{grid-template-columns:1fr}}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;
  font-size:0.875rem;font-weight:600;color:var(--ink-2);transition:all .12s}
.chip:hover{border-color:#B9C4D2;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip-sm{padding:5px 11px;font-size:0.8rem;font-weight:600}
.chip-count{margin-left:6px;opacity:.65;font-weight:500}
.picked{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.tag{display:inline-flex;align-items:center;gap:7px;background:var(--cobalt-soft);color:var(--navy);
  border-radius:999px;padding:5px 8px 5px 12px;font-size:0.825rem;font-weight:600}
.tag button{width:17px;height:17px;border-radius:50%;background:rgba(10,42,78,.14);color:var(--navy);
  font-size:0.75rem;line-height:1;display:grid;place-items:center}
.tag button:hover{background:rgba(10,42,78,.28)}

/* 연구주제 입력 */
.topic{display:flex;gap:11px;align-items:flex-start;margin-bottom:11px}
.topic-n{width:26px;height:26px;flex:none;border-radius:50%;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-size:0.7812rem;font-weight:700;margin-top:9px}
.topic-n.opt{background:var(--line);color:var(--ink-3)}
.example{background:#FAFBFD;border:1px solid var(--line-2);border-radius:var(--r-md);padding:13px 15px;margin-top:12px}
.example-quiet{background:#FFFCF4;border-color:#EFE4C9}
.example-quiet h5{color:#8A6A1E}
.example-list{margin:0;font-size:0.85rem;color:var(--ink-2);line-height:1.9;word-break:keep-all}
.example h5{margin:0 0 7px;font-size:0.8125rem;color:var(--ink-2);font-weight:700}
.example li{font-size:0.8438rem;color:var(--ink-2);padding:3px 0;padding-left:13px;position:relative}
.example li::before{content:"";position:absolute;left:2px;top:12px;width:4px;height:4px;border-radius:50%;background:var(--ink-3)}

/* 검토 */
.review dl{margin:0;border-top:1px solid var(--line-2)}
.review-row{display:flex;gap:16px;padding:12px 2px;border-bottom:1px solid var(--line-2);align-items:baseline}
.review-row dt{width:clamp(96px,14%,140px);flex:none;color:var(--ink-3);font-size:0.8438rem;font-weight:600}
.review-row dd{margin:0;flex:1;font-size:0.9062rem;white-space:pre-wrap;word-break:break-word}
.review-row dd .empty{color:var(--ink-3)}
@media(max-width:600px){.review-row{flex-direction:column;gap:3px}.review-row dt{width:auto}}

/* 완료 */
.done{text-align:center;padding:64px 28px}
.done-mark{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;background:var(--go-soft);
  display:grid;place-items:center}
.done h2{font-size:clamp(21px,1.4vw + 10px,28px);letter-spacing:-.03em}
.done p{color:var(--ink-2);margin-top:11px;font-size:0.9375rem}
.receipt{max-width:420px;margin:26px auto 0;text-align:left;background:#FAFBFD;border:1px solid var(--line-2);
  border-radius:var(--r-md);padding:16px 18px;font-size:0.875rem}
.receipt div{display:flex;justify-content:space-between;padding:5px 0;color:var(--ink-2)}
.receipt div b{color:var(--ink);font-weight:600}

/* ── 관리자 전용 화면 ── */
.dash-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.dash-head h1{font-size:clamp(20px,1.5vw + 8px,29px);letter-spacing:-.035em}
.dash-head .sub{color:var(--ink-2);font-size:0.875rem;margin-top:5px}
.dash-tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px;font-size:0.9062rem;font-weight:600;color:var(--ink-2);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(10px,1vw,16px);margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(14px,1.3vw,22px)}
.kpi dt{font-size:0.8125rem;color:var(--ink-2);font-weight:600}
.kpi dd{margin:7px 0 0;font-size:clamp(24px,1.5vw + 8px,34px);font-weight:800;letter-spacing:-.045em;line-height:1}
.kpi dd small{font-size:0.875rem;font-weight:600;color:var(--ink-3);letter-spacing:-.01em;margin-left:3px}
.kpi .foot{font-size:0.7875rem;color:var(--ink-3);margin-top:9px}
.kpi .bar{height:4px;border-radius:2px;background:var(--line-2);margin-top:11px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--navy)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(16px,1.6vw,26px)}
.panel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.panel-head h3{font-size:1.0rem;letter-spacing:-.025em}
.panel-head .note{font-size:0.8rem;color:var(--ink-3);margin-left:auto}
.cols-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:clamp(12px,1.2vw,18px)}
.cols-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(12px,1.2vw,18px)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:0.8125rem;color:var(--ink-2);margin-top:14px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}

.stack{display:flex;height:13px;border-radius:3px;overflow:hidden;background:var(--line-2)}
.stack i{display:block;height:100%}
.brow{display:grid;grid-template-columns:minmax(84px,24%) minmax(0,1fr) 46px;gap:11px;align-items:center;padding:6px 0;font-size:0.8438rem}
.brow .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .vl{text-align:right;color:var(--ink-2);font-weight:600}
.bar-t{height:9px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--navy-2);border-radius:3px}

.rank{display:grid;grid-template-columns:20px 1fr auto;gap:11px;align-items:center;padding:7px 0;
  border-bottom:1px solid var(--line-2);font-size:0.875rem}
.rank:last-child{border-bottom:none}
.rank .n{color:var(--ink-3);font-size:0.7812rem;font-weight:700;text-align:right}
.rank .v{font-weight:700;font-variant-numeric:tabular-nums}
.rank .track2{grid-column:2/4;height:5px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:-3px}
.rank .track2 i{display:block;height:100%;background:var(--cobalt)}

/* 히트맵 */
.heat-scroll{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;font-size:clamp(11.5px,0.8vw,13.5px);width:100%}
table.heat th{font-weight:600;color:var(--ink-2);text-align:left;padding:4px 6px;white-space:nowrap}
table.heat thead th{font-size:clamp(10.5px,0.72vw,12.2px);height:clamp(104px,8vw,132px);vertical-align:bottom;padding:0 0 8px}
table.heat thead th div{writing-mode:vertical-rl;text-orientation:upright;text-align:left;
  line-height:1.05;font-weight:600;letter-spacing:-.02em;margin:0 auto}
table.heat tbody th{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line-2)}
table.heat td{width:clamp(24px,1.9vw,36px);height:clamp(24px,1.9vw,36px);text-align:center;border-radius:3px;color:#fff;font-weight:700;
  font-variant-numeric:tabular-nums;background:var(--line-2);cursor:default}
table.heat td.z{color:var(--ink-3);font-weight:400}
.heat-key{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:0.7812rem;color:var(--ink-3)}
.heat-key i{width:20px;height:11px;border-radius:2px;display:block}

/* 클러스터 카드 */
.clusters{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:clamp(12px,1.2vw,18px)}
.cl{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;padding:clamp(15px,1.4vw,22px);position:relative}
.cl.ok{border-color:#BFDCD1;background:linear-gradient(#F6FCFA,#fff 60px)}
.cl-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:13px}
.cl-top h4{font-size:1.0625rem;letter-spacing:-.03em}
.cl-score{margin-left:auto;text-align:right;flex:none}
.cl-score b{font-size:1.3125rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}

function makeDemo(n) {
  var r = rng(20260908), out = [], i;
  var startDay = new Date(CONFIG.opensAt + "T09:00:00").getTime();
  var span = Math.max(1, Math.round((Date.now() - startDay) / 86400000));
  for (i = 0; i < n; i++) {
    var dept = DEPTS[Math.floor(r() * DEPTS.length)];
    var college = DEPT_COLLEGE[dept];
    var stem = STEM_COLLEGES.indexOf(college) >= 0;
    var p = r();
    var intent = p < 0.84 ? "참여" : "불참";
    var track = intent === "불참" ? "" : (r() < 0.36 ? "미래인재" : "AI 융합인재");
    var isAI = track === "AI 융합인재";
    var picks = [];
    var k = 1 + Math.floor(r() * (stem ? 3 : 2));
    var weighted = stem ? STEM_POOL : SOC_POOL;
    var guard = 0;
    while (picks.length < k && guard++ < 40) {
      var t = weighted[Math.floor(r() * weighted.length)];
      if (picks.indexOf(t) < 0) picks.push(t);
    }
    if (r() < 0.30 && picks.indexOf("AI/SW") < 0) picks.push("AI/SW");

      var pool = (topics.length < bank.length) ? bank : TOPIC_BANK._공통;
      var cand = pool[Math.floor(r() * pool.length)];
      if (topics.indexOf(cand) < 0) topics.push(cand);

/* 외부 호스팅에서 Apps Script 를 부를 때 쓰는 통신.
   1순위 fetch POST(단순 요청이라 사전 확인 없이 통과), 실패하면 JSONP 로 재시도한다. */
function jsonp(body) {
  return new Promise(function (res, rej) {
    var cb = "__bk" + Date.now() + Math.floor(Math.random() * 10000);
    var url = REMOTE + "?action=" + encodeURIComponent(body.action) + "&callback=" + cb +
      (body.code ? "&code=" + encodeURIComponent(body.code) : "") +
      (body.data ? "&data=" + encodeURIComponent(JSON.stringify(body.data)) : "");
    var el = document.createElement("script");
    var timer = setTimeout(function () { done(); rej(new Error("서버 응답이 없습니다.")); }, 25000);
    function done() {
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (el.parentNode) el.parentNode.removeChild(el);
    }
    window[cb] = function (data) { done(); res(data); };
    el.onerror = function () { done(); rej(new Error("서버에 연결하지 못했습니다.")); };
    el.src = url;
    document.body.appendChild(el);
  });
}
function callRemote(body) {
  if (typeof fetch !== "function") return jsonp(body);
  return fetch(REMOTE, { method: "POST", body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .catch(function () { return jsonp(body); });
}

/* ── 집계 로직 (순수 함수) ────────────────────────────────────────── */
var STOP = ["어떻게","무엇인가","무엇","어디","언제","어떤","얼마","위해","통해","대한","대해","있는가","있는","하는","되는","것인가","것인","것","수","및","등","가능","연구","방법","활용","적용","이하","우리","경우","한다","한가","까지","부터","때문","관련","이러한","그리고","또한","가장","매우","모든","무엇이","어디에","시대","실제","현장","사이","다시","오는","한편",
  "바꾸","늘리","줄이","높이","낮추","만들","이루","다루","가지","지니","이끌","넘어"];
/* 조사·어미를 떼고 명사에 가까운 토큰만 남긴다 (경량 휴리스틱) */
function tokenize(text) {
  return String(text || "").split(/[^가-힣A-Za-z0-9+·]+/).map(function (w) {
    w = w.replace(/(인가|한가|는가|일까|을까|던가)$/, "");
    return w.replace(/(으로써|으로서|이라는|에서의|에게서|으로|에서|에게|라는|들의|와의|과의|의|를|을|은|는|이|가|에|와|과|로|도|만|란)$/, "");
  }).filter(function (w) {
    if (w.length < 2 || /^\d+$/.test(w)) return false;
    if (STOP.indexOf(w) >= 0) return false;
    /* 용언 활용형 제거: ~하는/되는/있는/없는/될/된/한/할 + 종결어미 */
    if (/(하는가|되는가|인가|한가|되어야|되는|하는|있는|없는|이는|지는|오는|가는|나는|되며|하며|한다|된다|이다|였다|졌다|린다|간다|온다|낸다|든다|든가|을까|ㄹ까)$/.test(w)) return false;
    if (w.length >= 3 && /(될|된|한|할|해|져|줄|낼|볼|들|킬|칠|릴|하|되|지|시켜|시킬)$/.test(w)) return false;
    return true;
  });
}

/* 자유 기재된 산업·사회 문제 해결 분야를 예시 4개 범주로 자동 분류 */
function classifyProblem(text) {
  var t = String(text || "").replace(/\s/g, "");
  if (!t) return "";
  if (t.indexOf("인문사회과학기술") >= 0) return "인문사회과학기술융복합";
  if (t.indexOf("인문사회") >= 0) return "인문사회분야융복합";
  if (t.indexOf("과학기술") >= 0) return "과학기술분야융복합";
  if (t.indexOf("인공지능") >= 0 || /AI/i.test(t)) return "인공지능 융합형(AI+X)";
  return "그 밖의 분야 (직접 기재)";
}

function analyze(rows) {
  var a = {
    rows: rows, total: rows.length,
    intent: { "참여": 0, "불참": 0 },
    track: { "미래인재": 0, "AI 융합인재": 0 },
    declines: [], futureTopics: [],
    byCollege: {}, byDept: {},
    tech: {}, techDept: {}, heat: {},
    fusionType: {},
    keywords: {}, topics: [], daily: [],
    active: []
  };
  rows.forEach(function (r) {
    a.intent[r.intent] = (a.intent[r.intent] || 0) + 1;
    var col = r.college || DEPT_COLLEGE[r.dept] || "기타";
    if (!a.byCollege[col]) a.byCollege[col] = { total: 0, "참여": 0, "불참": 0, depts: [] };
    var c = a.byCollege[col];
    c.total++; c[r.intent]++;
    if (c.depts.indexOf(r.dept) < 0) c.depts.push(r.dept);
    a.byDept[r.dept] = (a.byDept[r.dept] || 0) + 1;
    if (r.intent === "불참") {
      if (r.declineReason) a.declines.push({ text: r.declineReason, name: r.name, dept: r.dept });
      return;
    }
    if (r.track) a.track[r.track] = (a.track[r.track] || 0) + 1;
    if (r.track === "미래인재") {
      if (r.futureTopic) a.futureTopics.push({ text: r.futureTopic, dept: r.dept, college: col, name: r.name, techs: [] });
      tokenize(r.futureTopic).forEach(function (w) { a.keywords[w] = (a.keywords[w] || 0) + 1; });
      return;
    }
    a.active.push(r);
    var ft = classifyProblem(r.problem);
    if (ft) a.fusionType[ft] = (a.fusionType[ft] || 0) + 1;
    (r.techs || []).forEach(function (t) {
      a.tech[t] = (a.tech[t] || 0) + 1;
      if (!a.techDept[t]) a.techDept[t] = [];
      if (a.techDept[t].indexOf(r.dept) < 0) a.techDept[t].push(r.dept);
      if (!a.heat[col]) a.heat[col] = {};
      a.heat[col][t] = (a.heat[col][t] || 0) + 1;
    });
    (r.topics || []).forEach(function (t) {
      if (!t) return;
      a.topics.push({ text: t, dept: r.dept, college: col, name: r.name, techs: r.techs || [] });
      tokenize(t).forEach(function (w) { a.keywords[w] = (a.keywords[w] || 0) + 1; });
    });
  });

  // 일자별 누적
  var byDay = {};
  rows.forEach(function (r) {
    var d = String(r.submittedAt || "").slice(0, 10);
    if (d) byDay[d] = (byDay[d] || 0) + 1;
  });
  var acc = 0;
  Object.keys(byDay).sort().forEach(function (d) { acc += byDay[d]; a.daily.push({ date: d, n: byDay[d], cum: acc }); });

  var seen = {};
  rows.forEach(function (r) {
    var k = String(r.name || "").trim() + "|" + String(r.dept || "").trim();
    if (!seen[k]) seen[k] = [];
    seen[k].push(r);
  });
  a.dupes = Object.keys(seen).filter(function (k) { return seen[k].length > 1; })
    .map(function (k) { return { label: k.replace("|", " · "), n: seen[k].length }; });

  a.responseRate = pct(a.total, CONFIG.targetCount);
  a.joined = a.intent["참여"];
  a.activeDepts = uniq(rows.filter(function (r) { return r.intent === "참여"; }).map(function (r) { return r.dept; }));
  a.techRank = Object.keys(a.tech).map(function (t) {
    return { tech: t, n: a.tech[t], depts: (a.techDept[t] || []).length };
  }).sort(function (x, y) { return y.n - x.n || y.depts - x.depts; });
  a.kwRank = Object.keys(a.keywords).map(function (k) { return { w: k, n: a.keywords[k] }; })
    .filter(function (x) { return x.n > 1; }).sort(function (x, y) { return y.n - x.n; });
  return a;
}

/* 교육연구단 후보 클러스터 */
function clusters(a) {
  return a.techRank.map(function (t) {
    var members = a.active.filter(function (r) { return (r.techs || []).indexOf(t.tech) >= 0; });
    var depts = uniq(members.map(function (m) { return m.dept; }));
    var cols = uniq(members.map(function (m) { return m.college || DEPT_COLLEGE[m.dept]; }));
    var firm = members.filter(function (m) { return m.intent === "참여"; }).length;
    var sizeS = Math.min(1, Math.log(1 + members.length) / Math.log(1 + CONFIG.minFacultyPerUnit * 3));
    var deptS = Math.min(1, depts.length / CONFIG.minDeptsPerUnit);
    var score = Math.round((sizeS * 0.60 + deptS * 0.40) * 100);
    var status = (members.length >= CONFIG.minFacultyPerUnit && depts.length >= CONFIG.minDeptsPerUnit)
      ? "요건 충족" : (members.length >= Math.ceil(CONFIG.minFacultyPerUnit * 0.6) ? "보완 필요" : "형성 초기");
    var topics = [];
    var primary = members.filter(function (m) { return (m.techs || [])[0] === t.tech; });
    primary.concat(members).forEach(function (m) {
      (m.topics || []).forEach(function (x) { if (x && topics.indexOf(x) < 0) topics.push(x); });
    });
    return {
      tech: t.tech, members: members, n: members.length, firm: firm,
      depts: depts, colleges: cols, score: score, status: status,
      topics: topics.slice(0, 3)
    };
  }).sort(function (x, y) { return y.score - x.score || y.n - x.n; });
}

function submit() {
  if (S.submitting) return;
  var ids = ["basic", "intent", "track", "future", "topics", "fields"], all = {};
  activeSteps().forEach(function (s) {
    if (ids.indexOf(s.id) < 0) return;
    var e = validate(s.id);
    Object.keys(e).forEach(function (k) { all[k] = e[k]; });
  });
  if (Object.keys(all).length) {
    S.errors = all;
    var steps = activeSteps();
    for (var i = 0; i < steps.length; i++) {
      if (Object.keys(validate(steps[i].id)).length) { S.step = i; break; }
    }
    renderSurvey(); toast("빠진 항목이 있어 해당 화면으로 이동했습니다."); return;
  }
  S.submitting = true;
  var btn = $("#next"); if (btn) { btn.disabled = true; btn.textContent = "제출 중…"; }
  var d = S.data;
  var payload = {
    name: d.name.trim(), dept: deptValue(), college: d.college || DEPT_COLLEGE[deptValue()] || "기타",
    rank: d.rank, email: emailValue(), intent: d.intent,
    declineReason: d.intent === "불참" ? d.declineReason.trim() : "",
    track: d.intent === "불참" ? "" : d.track,
    futureTopic: d.track === "미래인재" ? d.futureTopic.trim() : "",
    topics: d.track === "AI 융합인재" ? d.topics.map(function (t) { return t.trim(); }).filter(Boolean) : [],
    techs: d.track === "AI 융합인재" ? d.techs.slice() : [],
    problem: d.track === "AI 융합인재" ? d.problem.trim() : "",
    coreField: d.track === "AI 융합인재" ? d.coreField.trim() : "",
    vision: d.track === "AI 융합인재" ? d.vision.trim() : ""
  };
  Backend.submit(payload).then(function (res) {
    S.receipt = { id: (res && res.id) || "-", at: new Date(), name: payload.name, intent: payload.intent, email: payload.email };
    cache = null;
    go("done");
  }).catch(function (err) {
    S.submitting = false;
    if (btn) { btn.disabled = false; btn.textContent = "응답 제출"; }
    toast("제출에 실패했습니다. 잠시 후 다시 시도해 주세요.");
    console.error(err);
  });
}

function barRow(name, value, max, color) {
  return '<div class="brow"><span class="nm">' + esc(name) + "</span>" +
    '<span class="bar-t"><i style="width:' + (max ? (value / max * 100) : 0) + "%;background:" + (color || "var(--navy-2)") + '"></i></span>' +
    '<span class="vl num">' + value + "</span></div>";
}
function spark(daily) {
  if (!daily.length) return '<p class="hint">아직 응답이 없습니다.</p>';
  var w = 100, h = 42, maxc = daily[daily.length - 1].cum;
  var pts = daily.map(function (d, i) {
    var x = daily.length === 1 ? 0 : (i / (daily.length - 1)) * w;
    var y = h - (d.cum / (maxc || 1)) * (h - 4) - 2;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  return '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" style="width:100%;height:64px;display:block" aria-hidden="true">' +
    '<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--navy-2)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>' +
    '<polyline points="0,' + h + " " + pts.join(" ") + " " + w + "," + h + '" fill="rgba(47,111,208,.10)" stroke="none"/></svg>' +
    '<div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--ink-3);margin-top:6px">' +
    "<span>" + fmtDate(daily[0].date) + "</span><span>" + fmtDate(daily[daily.length - 1].date) + " · 누적 " + maxc + "명</span></div>";
}

}

function heatColor(v, max) {

function tabTopics() {

  var maxKw = kws.length ? kws[0].n : 1;
  var q = filters.q.trim();
  var all = A.topics.map(function (t) { return { t: t, track: "AI 융합인재" }; })
    .concat(A.futureTopics.map(function (t) { return { t: t, track: "미래인재" }; }));
  var list = all.filter(function (x) {
    var t = x.t;
    if (filters.track && x.track !== filters.track) return false;
    if (filters.tech && (t.techs || []).indexOf(filters.tech) < 0) return false;
    if (q && (t.text + t.dept + t.name).indexOf(q) < 0) return false;
    return true;
  });
  return '<div class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>연구주제 키워드</h3>' +
    '<span class="note">' + all.length + "건의 주제에서 2회 이상 등장한 낱말</span></div>" +
    (kws.length ? '<div class="kws">' + kws.map(function (k) {
      var s = 0.82 + (k.n / maxKw) * 0.72;
      var op = 0.42 + (k.n / maxKw) * 0.58;
      return '<button class="kw" data-kw="' + esc(k.w) + '" style="font-size:' + s.toFixed(2) + "rem;background:rgba(47,111,208," + (op * 0.18).toFixed(2) + ")\">" +
        esc(k.w) + '<span style="font-weight:600;opacity:.55;margin-left:5px" class="num">' + k.n + "</span></button>";
    }).join("") + "</div>" : '<p class="hint">아직 주제가 없습니다.</p>') + "</div>" +

    '<div class="panel"><div class="panel-head"><h3>제안된 연구주제</h3><span class="note">' + list.length + "건</span></div>" +
    '<div class="tbl-tools">' +
    '<input class="input" id="tq" placeholder="주제·학과·성명 검색" value="' + esc(filters.q) + '">' +
    '<select class="input" id="ttrack"><option value="">트랙 전체</option>' +
    TRACKS.map(function (t) { return '<option' + (filters.track === t ? " selected" : "") + ">" + esc(t) + "</option>"; }).join("") + "</select>" +
    '<select class="input" id="ttech"><option value="">전략기술 전체</option>' +
    TECH19.map(function (t) { return '<option' + (filters.tech === t ? " selected" : "") + ">" + esc(t) + "</option>"; }).join("") + "</select>" +
    (q || filters.tech || filters.track ? '<button class="btn btn-quiet" id="tclear">필터 지우기</button>' : "") + "</div>" +
    (list.length ? '<div class="tbl-wrap"><table class="data"><thead><tr><th style="width:52%">연구주제</th><th>트랙</th><th>제안자</th><th>소속</th><th>전략기술</th></tr></thead><tbody>' +
      list.slice(0, 120).map(function (x) {
        var t = x.t;
        return "<tr><td>" + esc(t.text) + '</td><td><span class="st"><i style="background:' + TRACK_COLOR[x.track] + '"></i>' +
          esc(x.track) + "</span></td><td>" + esc(t.name) + "</td><td>" + esc(t.dept) + "</td><td>" +
          esc((t.techs || []).join(", ") || "-") + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      (list.length > 120 ? '<p class="mini-note">상위 120건만 표시합니다. 전체는 CSV로 내보내 확인하세요.</p>' : "")
      : '<div class="empty-state"><b>조건에 맞는 주제가 없습니다.</b><p>검색어나 분야 필터를 바꿔보세요.</p></div>') + "</div>";
}
function bindTopics() {
  var q = $("#tq");
  if (q) q.oninput = debounce(function () { filters.q = q.value; paintTab(); var f = $("#tq"); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }, 260);
  var s = $("#ttech");
  if (s) s.onchange = function () { filters.tech = s.value; paintTab(); };
  var tr = $("#ttrack");
  if (tr) tr.onchange = function () { filters.track = tr.value; paintTab(); };
  var c = $("#tclear");
  if (c) c.onclick = function () { filters.q = ""; filters.tech = ""; filters.track = ""; paintTab(); };
  $$("[data-kw]").forEach(function (b) { b.onclick = function () { filters.q = b.dataset.kw; paintTab(); }; });
}
function debounce(fn, ms) {
  var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); };
}

      "</tr></thead><tbody>" + list.slice(0, 200).map(function (r) {

          '<td class="clip">' + esc((r.techs || []).join(", ") || "-") + "</td>" +

      : '<div class="card empty-state"><b>조건에 맞는 응답이 없습니다.</b><p>필터를 지우면 전체 응답을 볼 수 있습니다.</p></div>');

function bindResponses() {

/* 모달 */
function openModal(title, html) {
  var layer = $("#layer");
  layer.innerHTML = '<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div class="modal-head"><h3>' + esc(title) + '</h3><button id="mx" aria-label="닫기">×</button></div>' +
    '<div class="modal-body">' + html + "</div></div></div>";
  function close() { layer.innerHTML = ""; document.removeEventListener("keydown", onKey); }
  function onKey(e) { if (e.key === "Escape") close(); }
  $("#mx").onclick = close;
  $("#scrim").onclick = function (e) { if (e.target.id === "scrim") close(); };
  document.addEventListener("keydown", onKey);
  $("#mx").focus();
}

/* CSV */
function exportCSV() {
  var head = ["접수일시", "성명", "단과대학·대학원", "학과", "직급", "이메일", "참여의향", "불참사유", "트랙", "미래인재연구주제", "전략기술", "산업사회문제해결분야", "자동분류", "핵심분야", "주제1", "주제2", "주제3", "교육연구단구상"];
  var lines = [head];
  A.rows.forEach(function (r) {
    var t = r.topics || [];
    lines.push([r.submittedAt, r.name, r.college || DEPT_COLLEGE[r.dept] || "", r.dept, r.rank, r.email || "",
      r.intent, r.declineReason || "", r.track || "", r.futureTopic || "", (r.techs || []).join(" / "),
      r.problem || "", classifyProblem(r.problem), r.coreField || "", t[0] || "", t[1] || "", t[2] || "",
      r.vision || ""]);
  });
  var csv = "\ufeff" + lines.map(function (row) {
    return row.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\r\n");
  try {
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "BK21_참여의향_" + todayISO() + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    toast("CSV 파일을 내려받았습니다.");
  } catch (e) {
    openModal("CSV 데이터 복사", '<p style="font-size:0.8438rem;color:var(--ink-2);margin-bottom:10px">' +
      "이 환경에서는 파일 저장이 막혀 있습니다. 아래 내용을 복사해 스프레드시트에 붙여 넣으세요.</p>" +
      '<textarea class="input" rows="12" readonly>' + esc(csv) + "</textarea>");
  }
}

/* ── 부팅 ────────────────────────────────────────────────────────── */
document.addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest("[data-go]") : null;
  if (b) go(b.dataset.go === "admin" ? "admin" : "cover");
});
window.addEventListener("hashchange", function () {
  var r = location.hash.replace("#/", "") || "cover";
  if (r !== route) { route = r; render(); }
});
route = (location.hash.replace("#/", "") || "cover");
if (["cover", "survey", "admin", "done"].indexOf(route) < 0) route = "cover";
if (route === "survey" || route === "done") route = "cover";

/* 교원용 주소에는 관리자 메뉴가 나타나지 않는다.
   담당자는 주소 끝에 ?view=admin 을 붙여 들어오고, 코드로 한 번 더 확인한다.
   교내 계정으로 로그인된 상태라면 코드 없이 계정만으로 통과한다. */
if (hasGAS && google.script.url && google.script.url.getLocation) {
  app.innerHTML = '<div class="wrap"><div class="empty-state">화면을 준비하는 중…</div></div>';
  google.script.url.getLocation(function (loc) {
    var v = (loc && loc.parameter && loc.parameter.view) || "";
    if (v === "admin") { adminEntry = true; route = "admin"; }
    render();
  });
} else {
  if (REMOTE && /[?&]view=admin/.test(location.search)) { adminEntry = true; route = "admin"; }
  render();
}

})();
